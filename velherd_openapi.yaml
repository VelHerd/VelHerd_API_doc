  /api/v1/land_parcels:
    head:
      summary: introduction LandParcel
      tags:
        - API endpoints
        - Land Parcels
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Land Parcels


        ### Purpose


        This endpoint manages land parcels with their cadastral data.


        ---


        ### LandParcel has next parameters


        - (readonly) `id` — VelHerd ID of LandParcel
            
        - `name` — name of LandParcel
            
        - `registration_number` — registration number
            
        - `cadastral_number` — cadastral number
            
        - `cadastral_number_assigned_on` — date the cadastral number was
        assigned
            
        - `cadastral_area` — area by the cadastre
            
        - (readonly) `calculated_area` — area calculated from the contour
            
        - `cadastral_value` — normative valuation
            
        - `valuation_date` — date of the valuation
            
        - `purpose_code` — code of the designated purpose
            
        - `purpose_name` — designated purpose
            
        - `land_category` — land category
            
        - `land_use_type` — land use type
            
        - `ownership_form` — form of ownership
            
        - `country_code` — country code
            
        - `region` — region
            
        - `district` — district
            
        - `hromada` — hromada
            
        - `village_council` — village council
            
        - `address` — address
            
        - `archived` — is the parcel archived
            
        - `archived_on` — date of archiving
            
        - `geometry` — contour as GeoJSON (Polygon or MultiPolygon, WGS 84)
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of LandParcel
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `cadastral_number`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `cadastral_number`, `registration_number`, `land_category`,
        `land_use_type`, `ownership_form`, `region`, `district`, `hromada`,
        `archived`, `external_id`


        ### Order by


        `id`, `name`, `cadastral_number`


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/land_parcels
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of land parcel objects, where each object contains:
            
            - **id**: VelHerd ID of LandParcel.
                
            - **name**: Name of LandParcel.
                
            - **registration_number**: Registration number.
                
            - **cadastral_number**: Cadastral number.
                
            - **cadastral_number_assigned_on**: Date the cadastral number was assigned (date `YYYY-MM-DD`).
                
            - **cadastral_area**: Area by the cadastre (decimal, returned as a string).
                
            - **calculated_area**: Area calculated from the contour (decimal, returned as a string).
                
            - **cadastral_value**: Normative valuation (decimal, returned as a string).
                
            - **valuation_date**: Date of the valuation (date `YYYY-MM-DD`).
                
            - **purpose_code**: Code of the designated purpose.
                
            - **purpose_name**: Designated purpose.
                
            - **land_category**: Land category. Can be one of `agricultural`, `residential`, `nature_reserve`, `health`, `recreation`, `historical`, `forest`, `water`, `industry`.
                
            - **land_use_type**: Land use type. Can be one of `arable`, `perennial_plantations`, `hayfield`, `pasture`, `fallow`, `forest_belt`, `other`.
                
            - **ownership_form**: Form of ownership. Can be one of `private`, `state`, `communal`, `collective`.
                
            - **country_code**: Country code.
                
            - **region**: Region.
                
            - **district**: District.
                
            - **hromada**: Hromada.
                
            - **village_council**: Village council.
                
            - **address**: Address.
                
            - **archived**: Is the parcel archived (`true` or `false`).
                
            - **archived_on**: Date of archiving (date `YYYY-MM-DD`).
                
            - **geometry**: Contour as GeoJSON (Polygon or MultiPolygon, WGS 84).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of LandParcel.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

