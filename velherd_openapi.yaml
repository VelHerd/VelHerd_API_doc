                        "updated_at": "2026-03-02T09:14:27.512+02:00",
                        "agro_plan_applications": [
                            {
                                "id": 1,
                                "resource_id": 15,
                                "application_basis": "per_area",
                                "in_tank_mix": true,
                                "planned_quantity": "0.5",
                                "position": 1,
                                "external_id": null,
                                "description": null
                            }
                        ],
                        "agro_operation_ids": [
                            41,
                            42,
                            43
                        ]
                    }
                },
                {
                    "id": "2",
                    "type": "agro_plan",
                    "attributes": {
                        "id": 2,
                        "name": "Sowing sunflower",
                        "work_type_id": 4,
                        "season_id": 2,
                        "responsible_id": 3,
                        "source_template_id": null,
