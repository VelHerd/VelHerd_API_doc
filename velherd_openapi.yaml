  /api/v1/agro_plans:
    head:
      summary: introduction AgroPlan
      tags:
        - API endpoints
        - Agro Plans
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Agro Plans


        ### Purpose


        This endpoint manages agro plans — one work type with its resources
        planned for many crop rotation rows at once. The plan creates and
        manages its member operations.


        ---


        ### AgroPlan has next parameters


        - (readonly) `id` — VelHerd ID of AgroPlan
            
        - `name` — name of AgroPlan
            
        - `work_type_id` — ID of WorkType (`/work_types`)
            
        - `season_id` — ID of Season (`/seasons`)
            
        - `responsible_id` — ID of the responsible Employee (`/employees`)
            
        - `source_template_id` — ID of AgroOperationTemplate
        (`/agro_operation_templates`)
            
        - `planned_area` — planned area, in base units
            
        - `planned_spray_rate` — planned spray (working solution) rate, in base
        units
            
        - `planned_start_at` — planned start
            
        - `planned_finish_at` — planned finish
            
        - (readonly) `tech_map_row_id` — ID of the technological map row the
        plan was created from
            
        - (readonly) `farm_unit_item_id` — ID of FarmUnitItem
        (`/farm_unit_items`)
            
        - (readonly) `machinery_aggregate_id` — ID of the machinery aggregate
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of AgroPlan
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - `agro_plan_applications` — array of resources of the plan, see below
            
        - (readonly) `agro_operation_ids` — IDs of the member agro operations —
        what the bulk actions take. These are IDs of `agro_operation` objects of
        **Operations**, not of operations
            

        ### Required on create


        `planned_finish_at`, `planned_start_at`, `season_id`, `work_type_id`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            
        - `add_operations` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/add_operations
            
        - `detach_operation` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/detach_operation
            
        - `apply_recipe` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/apply_recipe
            
        - `bulk_edit` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/bulk_edit
            
        - `bulk_status` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/bulk_status
            
        - `bulk_detach` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/bulk_detach
            

        ### Filters by


        `id`, `name`, `work_type_id`, `season_id`, `responsible_id`,
        `source_template_id`, `external_id`


        ### Order by


        `id`, `name`, `planned_start_at`


        ### Important


        - Quantities, areas and spray rates are taken and returned in **base
        units** (the unit with `is_base` = `true` for its unit type, see
        `/units`), not in the units the user picked in the web interface.
            
        - Nested rows are created, changed and removed through
        `agro_plan_applications_attributes`: a row without `id` is added, a row
        with `id` is changed, a row with `id` and `"_destroy": true` is removed.
        Rows that are not sent stay as they are.
            
        - Bulk actions answer `200 OK` with `{"updated_ids": [...], "skipped":
        {"<agro operation id>": "<its status>"}}` — `skipped` lists the
        operations the action could not apply to because of their status.
        `apply_recipe` and `bulk_edit` apply only to operations in `draft` or
        `planned`. When any operation fails the whole action is rolled back and
        `422` is returned with `errors` — an object keyed by agro operation ID
        with the list of messages.
            

        ### Additional actions


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/add_operations


        Creates one member operation for each crop rotation row in
        `crop_rotation_ids`.


        Response: `201 Created` with the plan in the format of **Single
        Resource**.


        #### `POST`
        {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/detach_operation


        Detaches one operation from the plan whatever its status; the operation
        itself stays. `agro_operation_id` is an ID from `agro_operation_ids`.


        Response: `200 OK` with the plan.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/apply_recipe


        Copies the resources of the plan into the given member operations.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/bulk_edit


        Changes planned and/or actual values of the given member operations.
        `planned` takes `planned_start_at`, `planned_finish_at`,
        `responsible_id`, `planned_spray_rate` and `norms` (`resource_id`,
        `application_basis`, `norm`); `actual` takes `actual_start_at`,
        `actual_spray_rate` and `norms` (`resource_id`, `norm`). Norms and spray
        rates are in base units.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/bulk_status


        Moves the given member operations to `status` — `planned`,
        `in_progress`, `done` or `cancelled` — going through the intermediate
        statuses where needed. `cancel_reason` is used with `cancelled`.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/agro_plans/ID/bulk_detach


        Detaches the given member operations from the plan whatever their
        status; the operations themselves stay.


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/agro_plans
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of agro plan objects, where each object contains:
            
            - **id**: VelHerd ID of AgroPlan.
                
            - **name**: Name of AgroPlan.
                
            - **work_type_id**: ID of WorkType (`/work_types`).
                
            - **season_id**: ID of Season (`/seasons`).
                
            - **responsible_id**: ID of the responsible Employee (`/employees`).
                
            - **source_template_id**: ID of AgroOperationTemplate (`/agro_operation_templates`).
                
            - **planned_area**: Planned area, in base units (decimal, returned as a string).
                
            - **planned_spray_rate**: Planned spray (working solution) rate, in base units (decimal, returned as a string).
                
            - **planned_start_at**: Planned start (date and time, ISO 8601).
                
            - **planned_finish_at**: Planned finish (date and time, ISO 8601).
                
            - **tech_map_row_id**: ID of the technological map row the plan was created from.
                
            - **farm_unit_item_id**: ID of FarmUnitItem (`/farm_unit_items`).
                
            - **machinery_aggregate_id**: ID of the machinery aggregate.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of AgroPlan.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **agro_plan_applications**: Array of resources of the plan, see below.
                
                - `id`
                    
                - `resource_id` — applied resource (`/resources`)
                    
                - `application_basis` — `per_area` or `per_solution`
                    
                - `in_tank_mix` — is it part of a tank mix
                    
                - `planned_quantity` — norm, in base units
                    
                - `position`, `external_id`, `description`
                    
            - **agro_operation_ids**: IDs of the member agro operations — what the bulk actions take. These are IDs of `agro_operation` objects of **Operations**, not of operations.
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "agro_plan",
                    "attributes": {
                        "id": 1,
                        "name": "Spring herbicide 2026",
                        "work_type_id": 4,
                        "season_id": 2,
                        "responsible_id": 3,
                        "source_template_id": 1,
                        "planned_area": "350.0",
                        "planned_spray_rate": "200.0",
                        "planned_start_at": "2026-04-10T07:00:00.000+03:00",
                        "planned_finish_at": "2026-04-15T19:00:00.000+03:00",
                        "tech_map_row_id": null,
                        "farm_unit_item_id": null,
                        "machinery_aggregate_id": null,
