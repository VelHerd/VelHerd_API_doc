                        "animal_type_id": 1,
                        "breed": "Holstein",
                        "sex": "male",
                        "birth_date": "2022-11-02",
                        "color": "black and white",
                        "signs": null,
                        "transponder_code": "UA000123457",
                        "transponder_start_date": "2023-04-01",
