        - Harvest Results
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Harvest Results


        ### Purpose


        This endpoint manages harvest results of crop rotation rows — yields,
        harvested area and quality indicators.


        ---


        ### HarvestResult has next parameters


        - (readonly) `id` — VelHerd ID of HarvestResult
            
        - `crop_rotation_id` — ID of CropRotation (`/crop_rotations`)
            
        - (readonly) `source_type` — type of the record the result was taken
        from
            
        - (readonly) `source_id` — ID of the record the result was taken from
            
        - `harvest_type` — what was harvested
            
        - `data_source` — where the data came from
            
        - `gross_yield` — gross yield
            
        - `net_yield` — net yield
            
        - `harvested_area` — harvested area
            
        - `quality_indicators` — quality indicators (object). Keys: `moisture`,
        `impurity`, `waste_percentage`, `protein`, `gluten`, `fiber`,
        `oil_content`, `starch`, `ash`, `falling_number`, `test_weight`,
        `hectoliter_weight`, `acid_number`
            
        - `harvest_date` — harvest date
            
        - `analysis_date` — date of the quality analysis
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of HarvestResult
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `crop_rotation_id`, `data_source`, `harvest_type`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `crop_rotation_id`, `harvest_type`, `data_source`, `harvest_date`,
        `external_id`


        ### Order by


        `id`, `harvest_date`


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/harvest_results
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of harvest result objects, where each object
        contains:
            
            - **id**: VelHerd ID of HarvestResult.
                
            - **crop_rotation_id**: ID of CropRotation (`/crop_rotations`).
                
            - **source_type**: Type of the record the result was taken from.
                
            - **source_id**: ID of the record the result was taken from.
                
            - **harvest_type**: What was harvested. Can be one of `grain`, `straw`, `silage`, `haulm`, `chaff`, `green_mass`, `hay`, `other`.
                
            - **data_source**: Where the data came from. Can be one of `manual`, `telemetry`, `agro_operation`.
                
            - **gross_yield**: Gross yield (decimal, returned as a string).
                
            - **net_yield**: Net yield (decimal, returned as a string).
                
            - **harvested_area**: Harvested area (decimal, returned as a string).
                
            - **quality_indicators**: Quality indicators (object). Keys: `moisture`, `impurity`, `waste_percentage`, `protein`, `gluten`, `fiber`, `oil_content`, `starch`, `ash`, `falling_number`, `test_weight`, `hectoliter_weight`, `acid_number`.
                
            - **harvest_date**: Harvest date (date `YYYY-MM-DD`).
                
            - **analysis_date**: Date of the quality analysis (date `YYYY-MM-DD`).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of HarvestResult.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
