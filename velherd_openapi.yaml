  /api/v1/animal_location_assignments:
    head:
      summary: introduction AnimalLocationAssignment
      tags:
        - API endpoints
        - Animal Location Assignments
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Animal Location Assignments


        ### Purpose


        This endpoint manages the assignments of animals to farm unit items
        (locations) for a period of time. Only assignments of animals are
        visible and changed here.


        ---


        ### AnimalLocationAssignment has next parameters


        - (readonly) `id` — VelHerd ID of AnimalLocationAssignment
            
        - `farm_unit_item_id` — ID of FarmUnitItem the record is assigned to
        (`/farm_unit_items`)
            
        - (readonly) `assignable_type` — type of the assigned record, always
        `Animal`
            
        - `assignable_id` — ID of Animal that is assigned (`/animals`)
            
        - `start_at` — start of the assignment
            
        - `end_at` — end of the assignment, empty while it lasts
            
        - `assignment_type` — type of the assignment
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of AnimalLocationAssignment
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `assignable_id`, `assignment_type`, `farm_unit_item_id`, `start_at`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `assignable_id`, `farm_unit_item_id`, `assignment_type`,
        `external_id`


        ### Order by


        `id`, `start_at`


        ### Important


        - `assignable_type` is set to `Animal` automatically and does not need
        to be sent.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/animal_location_assignments
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of location assignment objects, where each object
        contains:
            
            - **id**: VelHerd ID of AnimalLocationAssignment.
                
            - **farm_unit_item_id**: ID of FarmUnitItem the record is assigned to (`/farm_unit_items`).
                
            - **assignable_type**: Type of the assigned record, always `Animal`.
                
            - **assignable_id**: ID of Animal that is assigned (`/animals`).
                
            - **start_at**: Start of the assignment (date and time, ISO 8601).
                
            - **end_at**: End of the assignment, empty while it lasts (date and time, ISO 8601).
                
            - **assignment_type**: Type of the assignment. Can be one of `permanent`, `temporary`, `lease`, `operation`, `storage`, `other`.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of AnimalLocationAssignment.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "location_assignment",
                    "attributes": {
                        "id": 1,
                        "farm_unit_item_id": 3,
