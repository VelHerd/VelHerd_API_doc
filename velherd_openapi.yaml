          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Animal Life Cycles


        ### Purpose


        This endpoint manages the progression of animals through life cycle
        stages, including the elimination of an animal from the herd.


        ---


        ### AnimalLifeCycle has next parameters


        - (readonly) `id` — VelHerd ID of AnimalLifeCycle
            
        - `animal_id` — ID of Animal (`/animals`)
            
        - `life_cycle_id` — ID of LifeCycle (`/life_cycles`)
            
        - `start_date` — date the animal entered the stage
            
        - `end_date` — date the animal left the stage
            
        - `is_elimination` — is it an elimination (the animal leaves the herd)
            
        - `elimination_reason` — reason of the elimination
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of AnimalLifeCycle
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `animal_id`, `elimination_reason`, `life_cycle_id`, `start_date`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `animal_id`, `life_cycle_id`, `is_elimination`, `external_id`


        ### Order by


        `id`, `start_date`


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/animal_life_cycles
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of animal life cycle objects, where each object
        contains:
            
            - **id**: VelHerd ID of AnimalLifeCycle.
                
            - **animal_id**: ID of Animal (`/animals`).
                
            - **life_cycle_id**: ID of LifeCycle (`/life_cycles`).
                
            - **start_date**: Date the animal entered the stage (date `YYYY-MM-DD`).
                
            - **end_date**: Date the animal left the stage (date `YYYY-MM-DD`).
                
            - **is_elimination**: Is it an elimination (the animal leaves the herd) (`true` or `false`).
                
            - **elimination_reason**: Reason of the elimination. Can be one of `sale`, `slaughter`, `death`, `other`.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of AnimalLifeCycle.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

