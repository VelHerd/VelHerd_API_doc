  /api/v1/employees:
    head:
      summary: introduction Employee
      tags:
        - API endpoints
        - Employees
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Employees


        ### Purpose


        This endpoint manages employees of the company.


        ---


        ### Employee has next parameters


        - (readonly) `id` — VelHerd ID of Employee
            
        - `user_id` — ID of the VelHerd user linked to the employee
            
        - `first_name` — first name
            
        - `last_name` — last name
            
        - `middle_name` — middle name
            
        - `status` — employment status
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - (write-only) `date_of_birth` — date of birth
            
        - (write-only) `sex` — sex
            
        - (write-only) `phone_number` — phone number
            
        - (write-only) `email` — email
            
        - (write-only) `address` — address
            
        - (write-only) `identification_number` — identification number
            
        - (write-only) `tax_number` — tax number
            
        - (write-only) `passport_number` — passport number
            
        - (write-only) `social_security_number` — social security number
            
        - (write-only) `nationality` — nationality
            
        - (write-only) `education_level` — education level
            
        - (write-only) `marital_status` — marital status
            
        - (write-only) `children_count` — number of children
            
        - (write-only) `emergency_contact_name` — emergency contact name
            
        - (write-only) `emergency_contact_phone` — emergency contact phone
            
        - (write-only) `notes` — free-form notes
            
        - (write-only) `description` — description of Employee
            

        ### Required on create


        `first_name`, `last_name`, `status`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            
        - `terminate` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/employees/ID/terminate
            

        ### Filters by


        `id`, `user_id`, `status`, `first_name`, `last_name`, `external_id`


        ### Order by


        `id`, `last_name`, `first_name`


        ### Important


        - Fields marked (write-only) are accepted on create and update but are
        never returned and cannot be used in filters: they are personal or
        payroll data.
            

        ### Additional actions


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/employees/ID/terminate


        Terminates the employee: closes the open employment period on `end_date`
        (optional, defaults to today), cancels the leaves still ahead and sets
        the status.


        Response: `200 OK` with the employee and
        `meta.draft_time_entries_after_end` — IDs of draft time entries dated
        after the end date, which should be reviewed.


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/employees
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of employee objects, where each object contains:
            
            - **id**: VelHerd ID of Employee.
                
            - **user_id**: ID of the VelHerd user linked to the employee.
                
            - **first_name**: First name.
                
            - **last_name**: Last name.
                
            - **middle_name**: Middle name.
                
            - **status**: Employment status. Can be one of `active`, `inactive`, `on_leave`, `terminated`.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "employee",
                    "attributes": {
                        "id": 1,
                        "user_id": 5,
                        "first_name": "Olena",
                        "last_name": "Koval",
                        "middle_name": "Petrivna",
                        "status": "active",
                        "external_id": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00"
                    }
                },
                {
                    "id": "2",
                    "type": "employee",
                    "attributes": {
                        "id": 2,
                        "user_id": null,
                        "first_name": "Taras",
                        "last_name": "Melnyk",
                        "middle_name": null,
                        "status": "on_leave",
                        "external_id": "ERP-00042",
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00"
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the employees, enabling
        clients to easily access and utilize the information.
