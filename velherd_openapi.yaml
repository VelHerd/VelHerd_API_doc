      description: >-
        ## API Endpoint: Work Types


        ### Purpose


        This endpoint manages the work types of the company. A work type is what
        every operation and agro plan is for.


        ---


        ### WorkType has next parameters


        - (readonly) `id` — VelHerd ID of WorkType
            
        - `work_type_group_id` — ID of WorkTypeGroup (`/work_type_groups`)
            
        - (readonly) `base_work_type_id` — ID of BaseWorkType
        (`/base_work_types`)
            
        - `code` — code of WorkType
            
        - `rate_basis` — what the work is measured in
            
        - `rate` — rate for a unit of the work
            
        - `agro_direction` — which crop rotation date a completed operation of
        this type sets, empty for other works
            
        - (readonly) `standard` — is WorkType a standard record imported from
        the global reference
            
        - `active` — is WorkType active
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of WorkType
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - `technological_operations` — array of technological operations
        available for the work type
            
        - `localized_name` — localized names of WorkType. Object where key is
        language, value is the text in that language. For setting it in one
        language use `localized_name_` with a language prefix, for example
        `localized_name_en` or `localized_name_uk`
            

        ### Required on create


        `work_type_group_id`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `code`, `work_type_group_id`, `base_work_type_id`, `rate_basis`,
        `agro_direction`, `standard`, `active`, `external_id`


        ### Order by


        `id`, `code`


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/work_types
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of work type objects, where each object contains:
            
            - **id**: VelHerd ID of WorkType.
                
            - **work_type_group_id**: ID of WorkTypeGroup (`/work_type_groups`).
                
            - **base_work_type_id**: ID of BaseWorkType (`/base_work_types`).
                
            - **code**: Code of WorkType.
                
            - **rate_basis**: What the work is measured in. Can be one of `area`, `time`, `head`, `mass`, `volume`, `count`, `distance`.
                
            - **rate**: Rate for a unit of the work (decimal, returned as a string).
                
            - **agro_direction**: Which crop rotation date a completed operation of this type sets, empty for other works. Can be one of `sowing`, `additional_sowing`, `resowing`, `harvesting`.
                
            - **standard**: Is WorkType a standard record imported from the global reference (`true` or `false`).
                
            - **active**: Is WorkType active (`true` or `false`).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of WorkType.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **technological_operations**: Array of technological operations available for the work type. Can be one of `applications`, `soil_tillage`, `irrigation`, `harvesting`.
                
            - **localized_name**: Localized names of WorkType. Object where key is language, value is the text in that language. For setting it in one language use `localized_name_` with a language prefix, for example `localized_name_en` or `localized_name_uk`.
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
