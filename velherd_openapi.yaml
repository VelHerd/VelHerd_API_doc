            - **parent_id**: ID of the parent Field for a subfield (`/fields`).
                
            - **region**: Region.
                
            - **district**: District.
                
            - **location**: Location.
                
            - **ownership_type**: Ownership type. Can be one of `owned`, `leased`, `shared`.
                
            - **soil_type**: Soil type.
                
            - **bonitet_score**: Soil quality score (bonitet) (decimal, returned as a string).
                
            - **moisture_zone**: Moisture zone. Can be one of `sufficient`, `insufficient`, `arid`.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of Field.
                
