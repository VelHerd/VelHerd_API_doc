  /api/v1/crop_structure_plans:
    head:
      summary: introduction CropStructurePlan
      tags:
        - API endpoints
        - Crop Structure Plans
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Crop Structure Plans


        ### Purpose


        This endpoint manages crop structure plans — the calculation of which
        crops to sow on which fields in a season for the best margin, and
        applying the result to crop rotations.


        ---


        ### CropStructurePlan has next parameters


        - (readonly) `id` — VelHerd ID of CropStructurePlan
            
        - `season_id` — ID of Season (`/seasons`)
            
        - `name` — name of CropStructurePlan
            
        - `params` — parameters of the calculation (object), see below
            
        - (readonly) `applied_result` — what was applied the last time (object)
            
        - (readonly) `applied_at` — when the plan was last applied
            
        - (readonly) `archived_at` — when the plan was archived
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of CropStructurePlan
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `name`, `season_id`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            
        - `calculate` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/calculate
            
        - `apply_preview` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/apply_preview
            
        - `apply` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/apply
            
        - `archive` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/archive
            
        - `unarchive` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/unarchive
            

        ### Filters by


        `id`, `season_id`, `name`, `external_id`


        ### Order by


        `id`, `name`


        ### Important


        - Quantities, areas and spray rates are taken and returned in **base
        units** (the unit with `is_base` = `true` for its unit type, see
        `/units`), not in the units the user picked in the web interface.
            
        - `params` keys: `objective` (`max_margin`), `decision_case`
        (`optimistic`, `realistic`, `pessimistic`), `working_days_coefficient`
        (0–1, default 0.7), `allow_fallow`, `capacities` (array of
        `operation_kind` — `sowing` or `harvesting`, `group_key`,
        `area_per_day`, `source` — `manual` or `telemetry`), `crop_limits`
        (array of `crop_id`, `min_area`, `max_area`), `crops` (array of
        `crop_id`, `resource_id`, `min_return_years`, `sowing_window_start`,
        `sowing_window_end`, `optimal_sowing_end`, `maturation_days`,
        `harvest_window_days`, `late_sowing_yield_penalty`,
        `harvest_delay_loss`, `sowing_group_key`, `harvest_group_key`,
        `contract_quantity`, `contract_price`, `forecasts` — object with
        `optimistic`, `realistic`, `pessimistic`, each with `yield_per_area`,
        `price`, `cost_per_area`).
            
        - `calculate`, `apply_preview` and `apply` use the stored `params`, or
        the `params` and `locks` sent in `data`. `locks` is an array of
        `field_id`, `crop_id`, `resource_id`, `sowing_date` — fields whose crop
        is fixed by hand.
            

        ### Additional actions


        #### `POST`
        {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/calculate


        Calculates the plan without saving anything.


        Response: `200 OK` with `{"result": {...}}`.


        #### `POST`
        {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/apply_preview


        Shows what `apply` would do without changing anything.


        Response: `200 OK` with `{"preview": {"created": 0, "updated": 0,
        "skipped": 0, "rows": [...]}}`.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/apply


        Creates and updates crop rotation rows by the calculated plan. Rows that
        are approved or already sown are left as they are and reported as
        conflicts.


        Response: `200 OK` with `{"report": {"created": 0, "updated": 0,
        "skipped": 0, "conflicts": [...]}}`.


        #### `POST`
        {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/archive


        Archives the plan.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        #### `POST`
        {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans/ID/unarchive


        Returns the plan from the archive.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/crop_structure_plans
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of crop structure plan objects, where each object
        contains:
            
            - **id**: VelHerd ID of CropStructurePlan.
                
            - **season_id**: ID of Season (`/seasons`).
                
            - **name**: Name of CropStructurePlan.
                
            - **params**: Parameters of the calculation (object), see below.
                
            - **applied_result**: What was applied the last time (object).
                
            - **applied_at**: When the plan was last applied (date and time, ISO 8601).
                
            - **archived_at**: When the plan was archived (date and time, ISO 8601).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of CropStructurePlan.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

