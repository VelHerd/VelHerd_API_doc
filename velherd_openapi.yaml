  /api/v1/machinery_schedule:
    head:
      summary: introduction MachinerySchedule
      tags:
        - API endpoints
        - Machinery Schedule
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: |-
        ## API Endpoint: Machinery Schedule

        ### Purpose

        This endpoint reads the machinery schedule of a season — how many machines and implements of each class the season's agro plans need day by day, against the units the fleet has. The schedule is computed from the plans, the tech maps and the fleet, never stored, so it is read only and has no records of its own: there is no `ids`, no single resource, no pagination.

        ---

        ### Request Format

        - **Method**: GET

        - **URL**: {{baseUrl}}/api/{{apiVersion}}/machinery_schedule?season_id=ID


        `season_id` is required: without it the response is `422`, for an unknown season `404`.

        ### Acceptable methods

        - `Resources collection` only


        ### Important

        - Areas are returned in the **base area unit** (see `/units`), not in the unit the user picked in the web interface.

        - A plan's shifts are spread evenly over the calendar days of its window; an aggregate is split into its classes, so two aggregates pulled by the same tractor class compete for it. The need of a class on a day is rounded up only after the works of the day are summed.

        - A unit under repair still counts as available; only a written-off unit has left the yard.

        - A plan the schedule cannot count stays in `works` with its `reason` instead of its shifts: `no_aggregate`, `no_area`, `basis_not_supported` (the work type is not counted per area), `norm_not_set`.

        - Reading needs the `MachinerySchedule` permission (read), which a company role may grant without granting the fleet or the plans.


        ### Response Structure

        The response will contain a JSON object with the following structure:

        - **season**: `id` and `name` of the season.

        - **areaUnitLabel**: Symbol of the base area unit the areas are in.

        - **decades**: The axis — every calendar decade (the 1st–10th, the 11th–20th and the 21st to the month's end) from the first busy day to the last, the empty ones included: `key` (ISO date of the first day), `number` (1–3), `startOn`, `endOn`.

        - **lines**: One row per class of machines and implements the plans need, machines first: `key`, `kind` (`machine_type` or `equipment_type`), `name`, `available` (units in service), `peak` (most units needed on one day of the season), `deficit` (is any day short), `contractArea` (area no own unit can take over the season), `decades` — per decade `key`: `needed` (busiest day of the decade), `deficit` (units short on that day), `contractArea`.

        - **bottlenecks**: The decades a class is short in: `key`, `className`, `available`, `needed`, `deficit`, `contractArea`, `startOn`, `endOn`.

        - **works**: The plans the schedule is built from: `key`, `name`, `source` (`plan`, or `forecast` for a plan still expected from an approved tech map), `planId`, `reason` (why it is not counted, or empty), `techMapId`, `techMapName`, `farmUnitItemName`, `workTypeName`, `aggregateName`, `startOn`, `finishOn`, `area`, `shifts`.

        - **summary**: `worksCount`, `forecastCount`, `gapsCount` (works with a `reason`), `deficitClassesCount`.


        ### Example Response

        ``` json
        {
            "season": {
                "id": 2,
                "name": "2026"
            },
            "areaUnitLabel": "m²",
            "decades": [
                {
                    "key": "2026-04-11",
                    "number": 2,
                    "startOn": "2026-04-11",
                    "endOn": "2026-04-20"
                },
                {
                    "key": "2026-04-21",
                    "number": 3,
                    "startOn": "2026-04-21",
                    "endOn": "2026-04-30"
                }
            ],
            "lines": [
                {
                    "key": "machine_type-1",
                    "kind": "machine_type",
                    "name": "Tractor 1.4",
                    "available": 1,
                    "peak": 2,
                    "deficit": true,
                    "contractArea": "500000.0",
                    "decades": {
                        "2026-04-11": {
                            "needed": 2,
                            "deficit": 1,
                            "contractArea": "500000.0"
                        },
                        "2026-04-21": {
                            "needed": 1,
                            "deficit": 0,
                            "contractArea": "0.0"
                        }
                    }
                },
                {
                    "key": "equipment_type-3",
                    "kind": "equipment_type",
                    "name": "Seeder 12 m",
                    "available": 2,
                    "peak": 2,
                    "deficit": false,
                    "contractArea": "0.0",
                    "decades": {
                        "2026-04-11": {
                            "needed": 2,
                            "deficit": 0,
                            "contractArea": "0.0"
                        },
                        "2026-04-21": {
                            "needed": 1,
                            "deficit": 0,
                            "contractArea": "0.0"
                        }
                    }
                }
            ],
            "bottlenecks": [
                {
                    "key": "machine_type-1-2026-04-11",
                    "className": "Tractor 1.4",
                    "available": 1,
                    "startOn": "2026-04-11",
                    "endOn": "2026-04-20",
                    "needed": 2,
                    "deficit": 1,
                    "contractArea": "500000.0"
                }
            ],
            "works": [
                {
                    "key": 0,
                    "name": "Sowing of winter wheat",
                    "source": "plan",
                    "planId": 5,
                    "reason": null,
                    "techMapId": 1,
                    "techMapName": "Winter wheat after sunflower",
                    "farmUnitItemName": "North",
                    "workTypeName": "Sowing",
                    "aggregateName": "Sowing unit 12 m",
                    "startOn": "2026-04-20",
                    "finishOn": "2026-04-21",
                    "area": "1000000.0",
                    "shifts": "4.0"
                },
                {
                    "key": 1,
                    "name": "Rolling",
                    "source": "plan",
                    "planId": 6,
                    "reason": "no_aggregate",
                    "techMapId": null,
                    "techMapName": null,
                    "farmUnitItemName": "North",
                    "workTypeName": "Rolling",
                    "aggregateName": null,
                    "startOn": "2026-04-22",
                    "finishOn": "2026-04-23",
                    "area": "1000000.0",
                    "shifts": null
                }
            ],
            "summary": {
                "worksCount": 2,
                "forecastCount": 0,
                "gapsCount": 1,
                "deficitClassesCount": 1
            }
        }

         ```

        This response provides a structured overview of the machinery schedule, enabling clients to easily access and utilize the information.
    get:
      summary: get_machinery_schedule
      tags:
        - API endpoints
        - Machinery Schedule
      parameters:
        - name: Authorization
          in: header
          required: false
          deprecated: false
          schema: {}
        - name: season_id
          in: query
          required: true
          schema:
            type: integer
          example: 2
      responses: {}
    parameters:
      - name: apiVersion
        in: path
        required: true
        schema:
          type: string
  /api/v1/direct_uploads:
    post:
      summary: create_direct_upload
      tags:
        - API endpoints
        - Direct Uploads
      parameters:
        - name: Authorization
          in: header
          required: false
          deprecated: false
          schema: {}
      responses: {}
      description: >-
        ## API Endpoint: Direct Uploads


        ### Purpose


        The first step of attaching a file through the API (land document scans,
        employee document scans). The file itself is not sent here: the endpoint
        returns a URL to upload the file to storage directly, and a `signed_id`
        to pass to the record afterwards.


        ---


        ### How to attach a file


        1. `POST` {{baseUrl}}/api/{{apiVersion}}/direct_uploads with `blob`:
        `filename`, `byte_size` (bytes), `checksum` (Base64-encoded MD5 of the
        file), `content_type`.
            
        2. `PUT` the file bytes to `direct_upload.url` with exactly the headers
        from `direct_upload.headers`. No `Authorization` header is needed for
        this request.
            
        3. Pass `signed_id` in `file_signed_ids` when creating or updating the
        record.
            

        ### Important


        - Accounts with read-only access (`manager_read`, `guest`, `no_access`)
        get `403`.
            
        - A `signed_id` works only within the company of the token.
            

        ### Example Response


        ``` json

        {
            "signed_id": "eyJfcmFpbHMiOnsiZGF0YSI6NDIsInB1ciI6ImJsb2JfaWQifX0=--1a2b3c",
            "filename": "lease-scan.pdf",
            "byte_size": 482113,
            "content_type": "application/pdf",
            "direct_upload": {
                "url": "https://storage.example.com/uploads/abc123?signature=...",
                "headers": {
                    "Content-Type": "application/pdf",
                    "Content-MD5": "kH4yK0hYd8Qh0m5XoE0e4w=="
                }
            }
        }

         ```
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blob:
                  type: object
                  properties:
                    filename:
                      type: string
                    byte_size:
                      type: integer
                    checksum:
                      type: string
                    content_type:
                      type: string
    parameters:
      - name: apiVersion
        in: path
        required: true
        schema:
          type: string
