  /api/v1/employment_periods:
    head:
      summary: introduction EmploymentPeriod
      tags:
        - API endpoints
        - Employment Periods
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Employment Periods


        ### Purpose


        This endpoint manages employment periods of employees — hire, position,
        contract and schedule.


        ---


        ### EmploymentPeriod has next parameters


        - (readonly) `id` — VelHerd ID of EmploymentPeriod
            
        - (create only) `employee_id` — ID of Employee (`/employees`)
            
        - `hire_date` — hire date
            
        - `end_date` — end of the period
            
        - `end_reason` — why the period ended
            
        - `position` — position
            
        - `contract_type` — type of the contract
            
        - `work_schedule` — work schedule
            
        - `probation_end_date` — end of the probation
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - (write-only) `salary` — salary
            
        - (write-only) `salary_currency` — currency of the salary
            
        - (write-only) `salary_period` — period the salary is paid for
            
        - (write-only) `description` — description of EmploymentPeriod
            

        ### Required on create


        `employee_id`, `hire_date`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `employee_id`, `hire_date`, `end_date`, `end_reason`,
        `contract_type`, `work_schedule`, `external_id`


        ### Order by


        `id`, `hire_date`


        ### Important


        - Fields marked (write-only) are accepted on create and update but are
        never returned and cannot be used in filters: they are personal or
        payroll data.
            
        - Sending `salary`, `salary_currency` or `salary_period` requires the
        right to manage salaries; without it the request is refused with `403`.
            
        - `employee_id` is set on create only and is ignored on update.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/employment_periods
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of employment period objects, where each object
        contains:
            
            - **id**: VelHerd ID of EmploymentPeriod.
                
            - **employee_id**: ID of Employee (`/employees`).
                
            - **hire_date**: Hire date (date `YYYY-MM-DD`).
                
            - **end_date**: End of the period (date `YYYY-MM-DD`).
                
            - **end_reason**: Why the period ended. Can be one of `termination`, `position_change`, `salary_change`, `schedule_change`, `contract_change`.
                
            - **position**: Position.
                
            - **contract_type**: Type of the contract. Can be one of `labor_contract`, `civil_law_contract`, `temporary`, `internship`.
                
            - **work_schedule**: Work schedule. Can be one of `full_time`, `part_time`, `shift`, `hybrid`, `probation`, `flexible`, `remote`, `freelance`, `internship`, `contract`, `temporary`, `seasonal`, `volunteer`, `on_demand`, `job_sharing`.
                
            - **probation_end_date**: End of the probation (date `YYYY-MM-DD`).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "employment_period",
                    "attributes": {
                        "id": 1,
                        "employee_id": 1,
                        "hire_date": "2023-02-01",
                        "end_date": "2025-08-31",
                        "end_reason": "position_change",
                        "position": "Agronomist",
