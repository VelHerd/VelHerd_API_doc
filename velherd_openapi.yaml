                        "planned_start_at": "2026-04-20T07:00:00.000+03:00",
                        "planned_finish_at": "2026-04-30T19:00:00.000+03:00",
                        "tech_map_row_id": null,
                        "farm_unit_item_id": null,
                        "machinery_aggregate_id": null,
                        "external_id": "ERP-00042",
                        "description": null,
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00",
                        "agro_plan_applications": [],
                        "agro_operation_ids": []
                    }
                }
            ],
            "meta": {
                "page": 1,
