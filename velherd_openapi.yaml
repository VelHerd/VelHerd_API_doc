  /api/v1/agro_operation_templates:
    head:
      summary: introduction AgroOperationTemplate
      tags:
        - API endpoints
        - Agro Operation Templates
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Agro Operation Templates


        ### Purpose


        This endpoint manages templates (recipes) of agro operations — the work
        type and the resources with their norms that an operation or an agro
        plan can be built from.


        ---


        ### AgroOperationTemplate has next parameters


        - (readonly) `id` — VelHerd ID of AgroOperationTemplate
            
        - `name` — name of AgroOperationTemplate
            
        - `status` — status of AgroOperationTemplate
            
        - `work_type_id` — ID of WorkType (`/work_types`)
            
        - `responsible_id` — ID of the responsible Employee (`/employees`)
            
        - `planned_spray_rate` — planned spray (working solution) rate, in base
        units
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of AgroOperationTemplate
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - `agro_operation_template_applications` — array of resources of the
        template, see below
            

        ### Required on create


        `name`, `status`, `work_type_id`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `name`, `status`, `work_type_id`, `responsible_id`, `external_id`


        ### Order by


        `id`, `name`


        ### Important


        - Quantities, areas and spray rates are taken and returned in **base
        units** (the unit with `is_base` = `true` for its unit type, see
        `/units`), not in the units the user picked in the web interface.
            
        - Nested rows are created, changed and removed through
        `agro_operation_template_applications_attributes`: a row without `id` is
        added, a row with `id` is changed, a row with `id` and `"_destroy":
        true` is removed. Rows that are not sent stay as they are.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/agro_operation_templates
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of agro operation template objects, where each
        object contains:
            
            - **id**: VelHerd ID of AgroOperationTemplate.
                
            - **name**: Name of AgroOperationTemplate.
                
            - **status**: Status of AgroOperationTemplate. Can be one of `active`, `archived`.
                
            - **work_type_id**: ID of WorkType (`/work_types`).
                
            - **responsible_id**: ID of the responsible Employee (`/employees`).
                
            - **planned_spray_rate**: Planned spray (working solution) rate, in base units (decimal, returned as a string).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of AgroOperationTemplate.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **agro_operation_template_applications**: Array of resources of the template, see below.
                
                - `id`
                    
                - `resource_id` — applied resource (`/resources`)
                    
                - `application_basis` — `per_area` or `per_solution`
                    
                - `in_tank_mix` — is it part of a tank mix
                    
                - `planned_quantity` — norm, in base units
                    
                - `position`, `external_id`, `description`
                    

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "agro_operation_template",
                    "attributes": {
                        "id": 1,
                        "name": "Herbicide treatment, wheat",
                        "status": "active",
                        "work_type_id": 4,
                        "responsible_id": 3,
                        "planned_spray_rate": "200.0",
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00",
                        "agro_operation_template_applications": [
                            {
                                "id": 1,
                                "resource_id": 15,
                                "application_basis": "per_area",
                                "in_tank_mix": true,
                                "planned_quantity": "0.5",
                                "position": 1,
                                "external_id": null,
                                "description": null
                            }
                        ]
                    }
                },
                {
                    "id": "2",
                    "type": "agro_operation_template",
                    "attributes": {
                        "id": 2,
                        "name": "Top dressing UAN",
                        "status": "archived",
                        "work_type_id": 4,
                        "responsible_id": null,
                        "planned_spray_rate": null,
                        "external_id": "ERP-00042",
                        "description": null,
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00",
                        "agro_operation_template_applications": []
                    }
                }
            ],
            "meta": {
                "page": 1,
