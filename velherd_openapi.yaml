  /api/v1/crop_rotations:
    head:
      summary: introduction CropRotation
      tags:
        - API endpoints
        - Crop Rotations
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Crop Rotations


        ### Purpose


        This endpoint manages crop rotation rows — what is grown on a field
        shape in a production cycle, with planned and actual sowing and harvest
        dates.


        ---


        ### CropRotation has next parameters


        - (readonly) `id` — VelHerd ID of CropRotation
            
        - `field_id` — ID of Field (`/fields`)
            
        - `production_cycle_id` — ID of ProductionCycle (`/production_cycles`)
            
        - `field_shape_id` — ID of FieldShape (`/field_shapes`)
            
        - `resource_id` — ID of Resource — the seeds (`/resources`)
            
        - `status` — status of CropRotation
            
        - (readonly) `approved_by_id` — ID of the VelHerd user who approved the
        row
            
        - (readonly) `approved_at` — when the row was approved
            
        - `position` — order of the row on the field
            
        - `planned_sowing_date` — planned sowing date
            
        - `sowing_date` — actual sowing date
            
        - `planned_harvest_date` — planned harvest date
            
        - `harvest_date` — actual harvest date
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of CropRotation
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - (readonly) `crop_structure_plan_id` — ID of CropStructurePlan
        (`/crop_structure_plans`)
            

        ### Required on create


        `field_id`, `field_shape_id`, `planned_sowing_date`, `position`,
        `production_cycle_id`, `status`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `field_id`, `production_cycle_id`, `field_shape_id`, `status`,
        `crop_structure_plan_id`, `external_id`


        ### Order by


        `id`, `position`, `planned_sowing_date`


        ### Important


        - When `status` changes to `approved`, `approved_by_id` and
        `approved_at` are set to the token owner and the current time; when it
        changes away from `approved` they are cleared.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/crop_rotations
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of crop rotation objects, where each object
        contains:
            
            - **id**: VelHerd ID of CropRotation.
                
            - **field_id**: ID of Field (`/fields`).
                
            - **production_cycle_id**: ID of ProductionCycle (`/production_cycles`).
                
            - **field_shape_id**: ID of FieldShape (`/field_shapes`).
                
            - **resource_id**: ID of Resource — the seeds (`/resources`).
                
            - **status**: Status of CropRotation. Can be one of `draft`, `planned`, `approved`.
                
            - **approved_by_id**: ID of the VelHerd user who approved the row.
                
            - **approved_at**: When the row was approved (date and time, ISO 8601).
                
            - **position**: Order of the row on the field.
                
            - **planned_sowing_date**: Planned sowing date (date `YYYY-MM-DD`).
                
            - **sowing_date**: Actual sowing date (date `YYYY-MM-DD`).
                
            - **planned_harvest_date**: Planned harvest date (date `YYYY-MM-DD`).
                
            - **harvest_date**: Actual harvest date (date `YYYY-MM-DD`).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of CropRotation.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **crop_structure_plan_id**: ID of CropStructurePlan (`/crop_structure_plans`).
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "crop_rotation",
                    "attributes": {
                        "id": 1,
                        "field_id": 1,
                        "production_cycle_id": 3,
                        "field_shape_id": 1,
                        "resource_id": 21,
                        "status": "approved",
                        "approved_by_id": 2,
