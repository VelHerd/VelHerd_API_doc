                        "payment_type": "card",
                        "currency": "UAH",
                        "is_primary": false,
                        "external_id": "ERP-00042",
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00",
                        "masked_number": "**** 9876"
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

