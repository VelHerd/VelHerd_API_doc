        - Animals
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Animals


        ### Purpose


        This endpoint manages livestock records.


        ---


        ### Animal has next parameters


        - (readonly) `id` — VelHerd ID of Animal
            
        - `name` — name of Animal
            
        - `animal_type_id` — ID of AnimalType (`/animal_types`)
            
        - `breed` — breed
            
        - `sex` — sex
            
        - `birth_date` — date of birth
            
        - `color` — color
            
        - `signs` — distinctive signs
            
        - `transponder_code` — transponder (chip) code
            
        - `transponder_start_date` — date the transponder was set
            
        - `transponder_last_read_date` — date the transponder was last read
            
        - `transponder_place` — place of the transponder
            
        - `brand_code` — brand code
            
        - `brand_start_date` — date of branding
            
        - `brand_place` — place of the brand
            
        - `veterinarian_id` — ID of the veterinarian (VelHerd user)
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of Animal
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `animal_type_id`, `birth_date`, `name`, `sex`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `name`, `animal_type_id`, `sex`, `breed`, `transponder_code`,
        `brand_code`, `external_id`


        ### Order by


        `id`, `name`, `birth_date`


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/animals
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of animal objects, where each object contains:
            
            - **id**: VelHerd ID of Animal.
                
            - **name**: Name of Animal.
                
            - **animal_type_id**: ID of AnimalType (`/animal_types`).
                
            - **breed**: Breed.
                
            - **sex**: Sex. Can be one of `male`, `female`.
                
            - **birth_date**: Date of birth (date `YYYY-MM-DD`).
                
            - **color**: Color.
                
            - **signs**: Distinctive signs.
                
            - **transponder_code**: Transponder (chip) code.
                
            - **transponder_start_date**: Date the transponder was set (date `YYYY-MM-DD`).
                
            - **transponder_last_read_date**: Date the transponder was last read (date `YYYY-MM-DD`).
                
            - **transponder_place**: Place of the transponder.
                
            - **brand_code**: Brand code.
                
            - **brand_start_date**: Date of branding (date `YYYY-MM-DD`).
                
            - **brand_place**: Place of the brand.
                
            - **veterinarian_id**: ID of the veterinarian (VelHerd user).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of Animal.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "animal",
                    "attributes": {
                        "id": 1,
                        "name": "Zirka",
                        "animal_type_id": 1,
