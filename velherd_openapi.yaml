  /api/v1/stock_batches:
    head:
      summary: introduction StockBatch
      tags:
        - API endpoints
        - Stock Batches
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Stock Batches


        ### Purpose


        This endpoint retrieves stock batches — what came into a warehouse by
        one incoming movement and how much of it is left. It is read-only:
        batches are opened by incoming movements and their balances are kept by
        the stock movements.


        ---


        ### StockBatch has next parameters


        - (readonly) `id` — VelHerd ID of StockBatch
            
        - (readonly) `resource_id` — ID of Resource (`/resources`)
            
        - (readonly) `warehouse_id` — ID of FarmUnitItem with `item_type` =
        `warehouses` (`/farm_unit_items`)
            
        - (readonly) `batch_number` — batch number
            
        - (readonly) `income_quantity` — quantity that came in
            
        - (readonly) `used_quantity` — quantity used
            
        - (readonly) `current_quantity` — quantity left
            
        - (readonly) `reserved_quantity` — quantity reserved
            
        - (readonly) `cost` — cost
            
        - (readonly) `currency` — currency
            
        - (readonly) `expiration_date` — expiration date
            
        - (readonly) `details` — category-specific batch attributes (object),
        see **Stock Movements**
            
        - (readonly) `external_id` — an optional identifier used to reference
        this resource in an external system
            
        - (readonly) `description` — description of StockBatch
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            

        ### Filters by


        `id`, `resource_id`, `warehouse_id`, `batch_number`, `expiration_date`,
        `external_id`


        ### Order by


        `id`, `expiration_date`, `created_at`


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/stock_batches
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of stock batch objects, where each object contains:
            
            - **id**: VelHerd ID of StockBatch.
                
            - **resource_id**: ID of Resource (`/resources`).
                
            - **warehouse_id**: ID of FarmUnitItem with `item_type` = `warehouses` (`/farm_unit_items`).
                
            - **batch_number**: Batch number.
                
            - **income_quantity**: Quantity that came in (decimal, returned as a string).
                
            - **used_quantity**: Quantity used (decimal, returned as a string).
                
            - **current_quantity**: Quantity left (decimal, returned as a string).
                
            - **reserved_quantity**: Quantity reserved (decimal, returned as a string).
                
            - **cost**: Cost (decimal, returned as a string).
                
            - **currency**: Currency. Can be one of `usd`, `eur`, `uah`, `gbp`.
                
            - **expiration_date**: Expiration date (date `YYYY-MM-DD`).
                
            - **details**: Category-specific batch attributes (object), see **Stock Movements**.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of StockBatch.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "stock_batch",
                    "attributes": {
                        "id": 1,
                        "resource_id": 21,
                        "warehouse_id": 6,
                        "batch_number": "B-2026-001",
                        "income_quantity": "5000.0",
                        "used_quantity": "1200.0",
                        "current_quantity": "3800.0",
                        "reserved_quantity": "0.0",
                        "cost": "125000.0",
                        "currency": "uah",
                        "expiration_date": null,
                        "details": {
                            "harvest_year": 2025,
                            "germination": 95
                        },
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00"
                    }
                },
                {
                    "id": "2",
