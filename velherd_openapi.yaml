                    "attributes": {
                        "id": 2,
                        "resource_id": 21,
                        "warehouse_id": 6,
                        "batch_number": "B-2026-002",
                        "income_quantity": "200.0",
                        "used_quantity": "0.0",
                        "current_quantity": "200.0",
                        "reserved_quantity": "50.0",
                        "cost": null,
                        "currency": null,
                        "expiration_date": "2027-06-30",
                        "details": {},
                        "external_id": "ERP-00042",
                        "description": null,
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00"
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

