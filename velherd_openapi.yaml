      description: >-
        ## API Endpoint: Animal Productions


        ### Purpose


        This endpoint manages what animals produced — milk, eggs, wool and so
        on. Only productions of animals are visible and changed here.


        ---


        ### AnimalProduction has next parameters


        - (readonly) `id` — VelHerd ID of AnimalProduction
            
        - `resource_id` — ID of Resource that was produced (`/resources`)
            
        - (readonly) `producer_type` — type of the producer, always `Animal`
            
        - `producer_id` — ID of Animal that produced it (`/animals`)
            
        - `production_group_id` — ID of the production group
            
        - `quantity` — produced quantity
            
        - `produced_at` — date and time of the production
            
        - (readonly) `system` — was AnimalProduction created by the system
        rather than by a person
            
        - `locked` — is AnimalProduction locked against editing
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of AnimalProduction
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `produced_at`, `quantity`, `resource_id`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `producer_id`, `resource_id`, `production_group_id`, `locked`,
        `external_id`


        ### Order by


        `id`, `produced_at`


        ### Important


        - `producer_type` is set to `Animal` automatically and does not need to
        be sent.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/animal_productions
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of production objects, where each object contains:
            
            - **id**: VelHerd ID of AnimalProduction.
                
            - **resource_id**: ID of Resource that was produced (`/resources`).
                
            - **producer_type**: Type of the producer, always `Animal`. Can be one of `Animal`, `Field`.
                
            - **producer_id**: ID of Animal that produced it (`/animals`).
                
            - **production_group_id**: ID of the production group.
                
            - **quantity**: Produced quantity (decimal, returned as a string).
                
            - **produced_at**: Date and time of the production (date and time, ISO 8601).
                
            - **system**: Was AnimalProduction created by the system rather than by a person (`true` or `false`).
                
            - **locked**: Is AnimalProduction locked against editing (`true` or `false`).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of AnimalProduction.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
