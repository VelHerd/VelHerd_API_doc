          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Field Shapes


        ### Purpose


        This endpoint manages the contours of fields for periods of time. A
        field can have a new contour every season.


        ---


        ### FieldShape has next parameters


        - (readonly) `id` — VelHerd ID of FieldShape
            
        - `field_id` — ID of Field (`/fields`)
            
        - `geometry` — contour as GeoJSON (Polygon or MultiPolygon, WGS 84)
            
        - `cultivated_area` — cultivated area
            
        - `official_area` — area by documents
            
        - (readonly) `calculated_area` — area calculated from the contour
            
        - `start_date` — date the contour is valid from
            
        - `end_date` — date the contour is valid to
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of FieldShape
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `cultivated_area`, `field_id`, `start_date`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


