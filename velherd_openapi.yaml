      description: |-
        ## API Endpoint: Equipment Types

        ### Purpose

        This endpoint manages equipment types (classes) — the handbook of implement and stationary equipment classes a company's fleet and machinery aggregates refer to.

        ---

        ### EquipmentType has next parameters

        - (readonly) `id` — VelHerd ID of EquipmentType

        - `name` — name of EquipmentType, unique

        - `category` — kind of the class

        - `working_width` — working width of an implement, metres; empty for a stationary class

        - `active` — is the class offered in the forms, `true` by default

        - `external_id` — an optional identifier used to reference this resource in an external system

        - `description` — description of EquipmentType

        - (readonly) `created_at`

        - (readonly) `updated_at`


        ### Required on create

        `category`, `name`

        ### Acceptable methods

        - `Ids`

        - `Single Resource`

        - `Create Resource`

        - `Update Resource`

        - `Delete Resource`


        ### Filters by

        `id`, `name`, `category`, `active`, `external_id`

        ### Order by

        `id`, `name`

        ### Important

        - Only an `implement` class joins machinery aggregates and keeps a `working_width`; a width sent for a `stationary` class is dropped.

        - A class that equipment or machinery aggregates refer to cannot be deleted: `DELETE` answers `422` with `errors`.


        ---

        ### Request Format

        - **Method**: GET

        - **URL**: {{baseUrl}}/api/{{apiVersion}}/equipment_types


        ### Response Structure

        The response will contain a JSON object with the following structure:

        - **data**: An array of equipment type objects, where each object contains:

            - **id**: VelHerd ID of EquipmentType.

            - **name**: Name of EquipmentType, unique.

            - **category**: Kind of the class. Can be one of `implement` (pulled by a machine: harrow, seeder, header), `stationary` (stands on its own: milking machine, dryer).

            - **working_width**: Working width of an implement, metres; empty for a stationary class.

            - **active**: Is the class offered in the forms, `true` by default.

            - **external_id**: An optional identifier used to reference this resource in an external system.

            - **description**: Description of EquipmentType.

            - **created_at**: Created time

            - **updated_at**: Updated time


        - **meta**: Pagination info — `page`, `per_page`, `total_count`, `total_pages`. Pass `page[number]` and `page[size]` (default 100, max 500) to get other pages.


        ### Example Response

        ``` json
        {
            "data": [
                {
                    "id": "1",
                    "type": "equipment_type",
                    "attributes": {
                        "id": 1,
                        "name": "Disc harrow",
                        "category": "implement",
                        "working_width": "6.0",
                        "active": true,
                        "external_id": null,
