      responses: {}
      description: >-
        ## API Endpoint: Banks


        ### Purpose


        This endpoint manages the reference of banks used in bank accounts of
        counterparties.


        ---


        ### Bank has next parameters


        - (readonly) `id` — VelHerd ID of Bank
            
        - `name` — name of Bank
            
        - `mfo` — bank code (MFO)
            
        - `swift` — SWIFT code
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of Bank
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `name`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `name`, `mfo`, `swift`, `external_id`


        ### Order by


        `id`, `name`


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/banks
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of bank objects, where each object contains:
            
            - **id**: VelHerd ID of Bank.
                
            - **name**: Name of Bank.
                
            - **mfo**: Bank code (MFO).
                
            - **swift**: SWIFT code.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of Bank.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


