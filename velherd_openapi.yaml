  /api/v1/machines:
    head:
      summary: introduction Machine
      tags:
        - API endpoints
        - Machines
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: |-
        ## API Endpoint: Machines

        ### Purpose

        This endpoint manages machines — the tractors, combines and other self-propelled units of the company's fleet. Where a machine stands is kept in `/machine_location_assignments`.

        ---

        ### Machine has next parameters

        - (readonly) `id` — VelHerd ID of Machine

        - `machine_type_id` — ID of MachineType (`/machine_types`)

        - `brand` — brand of Machine

        - `model` — model of Machine

        - `registration_number` — registration (licence) number, unique; stored in upper case

        - `inventory_number` — inventory number, unique

        - `serial_number` — serial number

        - `year_of_manufacture` — year of manufacture, from 1950 to the next year

        - `power` — engine power, horsepower

        - `engine_hours` — engine hours counter

        - `status` — status of Machine

        - `decommissioned_on` — date the machine was written off; required with status `decommissioned` and forbidden otherwise

        - `acquired_on` — date of acquisition

        - `default_operator_id` — ID of Employee who usually drives it (`/employees`)

        - `fuel_resource_id` — ID of Resource of the `fuel` category its shifts are priced by (`/resources`)

        - `external_id` — an optional identifier used to reference this resource in an external system

        - `description` — description of Machine

        - (readonly) `created_at`

        - (readonly) `updated_at`

        - (readonly) `current_farm_unit_item_id` — ID of FarmUnitItem the machine stands at today, from its location assignments (`/farm_unit_items`)


        ### Required on create

        `brand`, `machine_type_id`, `model`

        ### Acceptable methods

        - `Ids`

        - `Single Resource`

        - `Create Resource`

        - `Update Resource`

        - `Delete Resource`


        ### Filters by

        `id`, `machine_type_id`, `status`, `registration_number`, `inventory_number`, `default_operator_id`, `fuel_resource_id`, `external_id`

        ### Order by

        `id`, `brand`, `model`, `year_of_manufacture`

        ### Important

        - `status` is `active` by default. Status `decommissioned` needs `decommissioned_on`; a date on a machine still in service is refused.

        - Machines in service count against the plan limit of the company; a create beyond the limit answers `422` with `errors`.

        - A machine with machine tasks cannot be deleted: `DELETE` answers `422` with `errors`.


        ---

        ### Request Format

        - **Method**: GET

        - **URL**: {{baseUrl}}/api/{{apiVersion}}/machines


        ### Response Structure

        The response will contain a JSON object with the following structure:

        - **data**: An array of machine objects, where each object contains:

            - **id**: VelHerd ID of Machine.

            - **machine_type_id**: ID of MachineType (`/machine_types`).

            - **brand**: Brand of Machine.

            - **model**: Model of Machine.

            - **registration_number**: Registration (licence) number, unique; stored in upper case.

            - **inventory_number**: Inventory number, unique.

            - **serial_number**: Serial number.

            - **year_of_manufacture**: Year of manufacture, from 1950 to the next year.

            - **power**: Engine power, horsepower.

            - **engine_hours**: Engine hours counter.

            - **status**: Status of Machine. Can be one of `active`, `under_repair`, `decommissioned`.

            - **decommissioned_on**: Date the machine was written off; required with status `decommissioned` and forbidden otherwise (date, ISO 8601).

            - **acquired_on**: Date of acquisition (date, ISO 8601).

            - **default_operator_id**: ID of Employee who usually drives it (`/employees`).

            - **fuel_resource_id**: ID of Resource of the `fuel` category its shifts are priced by (`/resources`).

            - **external_id**: An optional identifier used to reference this resource in an external system.

            - **description**: Description of Machine.

            - **created_at**: Created time

            - **updated_at**: Updated time

            - **current_farm_unit_item_id**: ID of FarmUnitItem the machine stands at today, from its location assignments (`/farm_unit_items`).


        - **meta**: Pagination info — `page`, `per_page`, `total_count`, `total_pages`. Pass `page[number]` and `page[size]` (default 100, max 500) to get other pages.


        ### Example Response

        ``` json
        {
            "data": [
                {
                    "id": "1",
                    "type": "machine",
                    "attributes": {
                        "id": 1,
                        "machine_type_id": 1,
                        "brand": "John Deere",
                        "model": "8R 370",
                        "registration_number": "AA1234BP",
                        "inventory_number": "M-0001",
                        "serial_number": null,
                        "year_of_manufacture": 2021,
                        "power": "370.0",
                        "engine_hours": "1250.5",
                        "status": "active",
                        "decommissioned_on": null,
                        "acquired_on": "2021-03-15",
                        "default_operator_id": 3,
                        "fuel_resource_id": 12,
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00",
                        "current_farm_unit_item_id": 7
                    }
                },
                {
                    "id": "2",
                    "type": "machine",
                    "attributes": {
                        "id": 2,
                        "machine_type_id": 1,
                        "brand": "MTZ",
                        "model": "892",
                        "registration_number": "AA5678BP",
                        "inventory_number": "M-0002",
                        "serial_number": "80912345",
                        "year_of_manufacture": 2012,
                        "power": "90.0",
                        "engine_hours": "8400.0",
                        "status": "decommissioned",
                        "decommissioned_on": "2026-02-01",
                        "acquired_on": "2012-05-10",
                        "default_operator_id": null,
                        "fuel_resource_id": null,
                        "external_id": "ERP-M-0002",
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00",
                        "current_farm_unit_item_id": null
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

