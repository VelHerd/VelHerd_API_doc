      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: |-
        ## API Endpoint: Machine Types

        ### Purpose

        This endpoint manages machine types (classes) — the handbook of tractor and self-propelled machine classes a company's fleet and machinery aggregates refer to.

        ---

        ### MachineType has next parameters

        - (readonly) `id` — VelHerd ID of MachineType

        - `name` — name of MachineType, unique

        - `power_min` — lower bound of the engine power of the class, horsepower

        - `power_max` — upper bound of the engine power of the class, horsepower

        - `active` — is the class offered in the forms, `true` by default

        - `external_id` — an optional identifier used to reference this resource in an external system

        - `description` — description of MachineType

        - (readonly) `created_at`

        - (readonly) `updated_at`


        ### Required on create

        `name`

        ### Acceptable methods

        - `Ids`

        - `Single Resource`

        - `Create Resource`

        - `Update Resource`

        - `Delete Resource`


        ### Filters by

        `id`, `name`, `active`, `external_id`

        ### Order by

        `id`, `name`

        ### Important

        - `power_max` cannot be lower than `power_min`.

        - A class that machines or machinery aggregates refer to cannot be deleted: `DELETE` answers `422` with `errors`.


        ---

        ### Request Format

        - **Method**: GET

        - **URL**: {{baseUrl}}/api/{{apiVersion}}/machine_types


        ### Response Structure

        The response will contain a JSON object with the following structure:

        - **data**: An array of machine type objects, where each object contains:

            - **id**: VelHerd ID of MachineType.

            - **name**: Name of MachineType, unique.

            - **power_min**: Lower bound of the engine power of the class, horsepower.

            - **power_max**: Upper bound of the engine power of the class, horsepower.

            - **active**: Is the class offered in the forms, `true` by default.

            - **external_id**: An optional identifier used to reference this resource in an external system.

            - **description**: Description of MachineType.

            - **created_at**: Created time

            - **updated_at**: Updated time


        - **meta**: Pagination info — `page`, `per_page`, `total_count`, `total_pages`. Pass `page[number]` and `page[size]` (default 100, max 500) to get other pages.


