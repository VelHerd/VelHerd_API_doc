  /api/v1/land_documents:
    head:
      summary: introduction LandDocument
      tags:
        - API endpoints
        - Land Documents
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Land Documents


        ### Purpose


        This endpoint manages land documents — lease, sublease, emphyteusis,
        purchase and other agreements on land parcels, with their payment terms
        and scans.


        ---


        ### LandDocument has next parameters


        - (readonly) `id` — VelHerd ID of LandDocument
            
        - `document_type` — type of the document
            
        - `number` — number of the document
            
        - `signed_on` — date of signing
            
        - `registered_on` — date of the state registration
            
        - `registration_number` — state registration number
            
        - `start_date` — start of the term
            
        - `end_date` — end of the term
            
        - `status` — status of LandDocument
            
        - `terminated_on` — date of termination
            
        - `payment_form` — form of the payment
            
        - `payment_rate_type` — how the payment is calculated
            
        - `payment_amount` — payment amount
            
        - `payment_percent` — payment as percent of the valuation
            
        - `currency` — currency
            
        - `payment_frequency` — frequency of the payment
            
        - `payment_resource_id` — ID of Resource paid in kind (`/resources`)
            
        - `payment_quantity` — quantity of the resource paid in kind
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of LandDocument
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - `land_document_parcels` — array of parcels of the document with their
        parties, see below
            
        - (readonly) `files` — array of attached scans: `id`, `filename`,
        `content_type`, `byte_size`
            
        - (write-only) `file_signed_ids` — array of `signed_id` from **Direct
        Uploads** to attach
            
        - (write-only) `removed_file_ids` — array of IDs of attached files to
        remove
            

        ### Required on create


        `document_type`, `start_date`, `status`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `document_type`, `number`, `status`, `registration_number`,
        `payment_resource_id`, `external_id`


        ### Order by


        `id`, `signed_on`, `start_date`


        ### Important


        - Parcels are sent in `land_document_parcels_attributes`, parties of
        each parcel in its `land_document_parties_attributes`. Nested rows are
        created, changed and removed through `land_document_parcels_attributes`:
        a row without `id` is added, a row with `id` is changed, a row with `id`
        and `"_destroy": true` is removed. Rows that are not sent stay as they
        are.
            
        - Files are attached in two steps: first upload each file through
        **Direct Uploads** and take its `signed_id`, then pass the ids in
        `file_signed_ids` (array). To remove attached files pass their ids in
        `removed_file_ids` (array).
            
        - Saving an `active` document of type `purchase` moves its parcels into
        company ownership.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/land_documents
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of land document objects, where each object
        contains:
            
            - **id**: VelHerd ID of LandDocument.
                
            - **document_type**: Type of the document. Can be one of `lease`, `sublease`, `emphyteusis`, `superficies`, `permanent_use`, `purchase`, `sale`, `servitude`, `other`.
                
            - **number**: Number of the document.
                
            - **signed_on**: Date of signing (date `YYYY-MM-DD`).
                
            - **registered_on**: Date of the state registration (date `YYYY-MM-DD`).
                
            - **registration_number**: State registration number.
                
            - **start_date**: Start of the term (date `YYYY-MM-DD`).
                
            - **end_date**: End of the term (date `YYYY-MM-DD`).
                
            - **status**: Status of LandDocument. Can be one of `draft`, `active`, `terminated`.
                
            - **terminated_on**: Date of termination (date `YYYY-MM-DD`).
                
            - **payment_form**: Form of the payment. Can be one of `monetary`, `in_kind`, `mixed`.
                
            - **payment_rate_type**: How the payment is calculated. Can be one of `percent_of_valuation`, `fixed_amount`, `per_area`, `total_price`.
                
            - **payment_amount**: Payment amount (decimal, returned as a string).
                
            - **payment_percent**: Payment as percent of the valuation (decimal, returned as a string).
                
            - **currency**: Currency. Can be one of `usd`, `eur`, `uah`, `gbp`.
                
            - **payment_frequency**: Frequency of the payment. Can be one of `annual`, `semiannual`, `quarterly`, `monthly`, `one_time`.
                
            - **payment_resource_id**: ID of Resource paid in kind (`/resources`).
                
            - **payment_quantity**: Quantity of the resource paid in kind (decimal, returned as a string).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of LandDocument.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **land_document_parcels**: Array of parcels of the document with their parties, see below.
                
                - `id`, `land_parcel_id` — parcel (`/land_parcels`), `external_id`, `description`
                    
                - `land_document_parties` — array of `id`, `land_parcel_owner_id` (`/land_parcel_owners`), `share`, `area`, `external_id`, `description`
                    
            - **files**: Array of attached scans: `id`, `filename`, `content_type`, `byte_size`.
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "land_document",
                    "attributes": {
                        "id": 1,
                        "document_type": "lease",
                        "number": "L-2024/015",
                        "signed_on": "2024-02-01",
                        "registered_on": "2024-02-15",
                        "registration_number": "53726401",
                        "start_date": "2024-03-01",
                        "end_date": "2031-02-28",
                        "status": "active",
                        "terminated_on": null,
                        "payment_form": "monetary",
                        "payment_rate_type": "percent_of_valuation",
                        "payment_amount": null,
                        "payment_percent": "12.0",
                        "currency": "uah",
                        "payment_frequency": "annual",
                        "payment_resource_id": null,
                        "payment_quantity": null,
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00",
                        "land_document_parcels": [
                            {
                                "id": 1,
                                "land_parcel_id": 1,
                                "external_id": null,
                                "description": null,
                                "land_document_parties": [
                                    {
                                        "id": 1,
                                        "land_parcel_owner_id": 1,
                                        "share": "100.0",
                                        "area": "3.85",
                                        "external_id": null,
                                        "description": null
                                    }
                                ]
                            }
                        ],
                        "files": [
                            {
                                "id": 31,
                                "filename": "lease-scan.pdf",
                                "content_type": "application/pdf",
                                "byte_size": 482113
                            }
                        ]
                    }
                },
                {
                    "id": "2",
                    "type": "land_document",
                    "attributes": {
                        "id": 2,
                        "document_type": "purchase",
                        "number": "P-2026/001",
                        "signed_on": "2026-01-20",
                        "registered_on": null,
                        "registration_number": null,
                        "start_date": "2026-01-20",
                        "end_date": null,
                        "status": "draft",
                        "terminated_on": null,
                        "payment_form": null,
                        "payment_rate_type": null,
                        "payment_amount": null,
                        "payment_percent": null,
                        "currency": null,
                        "payment_frequency": null,
                        "payment_resource_id": null,
                        "payment_quantity": null,
                        "external_id": "ERP-00042",
                        "description": null,
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00",
                        "land_document_parcels": [],
                        "files": []
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the land documents,
        enabling clients to easily access and utilize the information.
