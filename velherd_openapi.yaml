      description: >-
        ## API Endpoint: Feed Rations


        ### Purpose


        This endpoint manages feed rations — what and how much one head of a
        given animal type and life cycle is fed.


        ---


        ### FeedRation has next parameters


        - (readonly) `id` — VelHerd ID of FeedRation
            
        - `name` — name of FeedRation
            
        - `animal_type_id` — ID of AnimalType (`/animal_types`)
            
        - `life_cycle_id` — ID of LifeCycle (`/life_cycles`)
            
        - (readonly) `user_id` — ID of the VelHerd user who created the ration
        (the token owner)
            
        - `status` — status of FeedRation
            
        - `locked` — is FeedRation locked against editing
            
