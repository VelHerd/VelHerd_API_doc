  /api/v1/leaves:
    head:
      summary: introduction Leave
      tags:
        - API endpoints
        - Leaves
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Leaves


        ### Purpose


        This endpoint manages leaves of employees — vacation, sick leave and so
        on — and their approval.


        ---


        ### Leave has next parameters


        - (readonly) `id` — VelHerd ID of Leave
            
        - (create only) `employee_id` — ID of Employee (`/employees`)
            
        - `leave_type` — type of the leave
            
        - (readonly) `status` — status of the leave
            
        - `start_date` — first day of the leave
            
        - `end_date` — last day of the leave
            
        - `days_count` — number of days
            
        - (readonly) `approved_by_id` — ID of the VelHerd user who approved or
        rejected the leave
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - (write-only) `notes` — free-form notes
            
        - (write-only) `description` — description of Leave
            

        ### Required on create


        `employee_id`, `end_date`, `leave_type`, `start_date`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            
        - `approve` — `POST` {{baseUrl}}/api/{{apiVersion}}/leaves/ID/approve
            
        - `reject` — `POST` {{baseUrl}}/api/{{apiVersion}}/leaves/ID/reject
            
        - `cancel` — `POST` {{baseUrl}}/api/{{apiVersion}}/leaves/ID/cancel
            

        ### Filters by


        `id`, `employee_id`, `leave_type`, `status`, `start_date`, `end_date`,
        `external_id`


        ### Order by


        `id`, `start_date`


        ### Important


        - A new leave is always `pending`. The status cannot be changed through
        `update`; it moves only by the additional actions below.
            
        - Fields marked (write-only) are accepted on create and update but are
        never returned and cannot be used in filters: they are personal or
        payroll data.
            
        - `employee_id` is set on create only and is ignored on update.
            

        ### Additional actions


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/leaves/ID/approve


        Approves the leave; `approved_by_id` is set to the token owner.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/leaves/ID/reject


        Rejects the leave; `approved_by_id` is set to the token owner.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/leaves/ID/cancel


        Cancels (withdraws) the leave. Needs the right to update leaves.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/leaves
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of leave objects, where each object contains:
            
            - **id**: VelHerd ID of Leave.
                
            - **employee_id**: ID of Employee (`/employees`).
                
            - **leave_type**: Type of the leave. Can be one of `vacation`, `sick_leave`, `personal`, `maternity`, `unpaid`, `other`.
                
            - **status**: Status of the leave. Can be one of `pending`, `approved`, `rejected`, `canceled`.
                
            - **start_date**: First day of the leave (date `YYYY-MM-DD`).
                
            - **end_date**: Last day of the leave (date `YYYY-MM-DD`).
                
