      description: >-
        ## API Endpoint: Base Life Cycles


        ### Purpose


        This endpoint retrieves the global reference of animal life cycles
        (stages). It is shared by all companies and is read-only; a company
        works with its own copies through **Life Cycles**.


        ---


        ### BaseLifeCycle has next parameters


        - (readonly) `id` — VelHerd ID of BaseLifeCycle
            
        - (readonly) `animal_type` — species the life cycle belongs to
            
        - (readonly) `cycle_code` — code of the life cycle
            
        - (readonly) `min_duration_days` — minimal duration of the stage in days
            
        - (readonly) `max_duration_days` — maximal duration of the stage in days
            
        - (readonly) `triggers` — array of event codes that move an animal to
        this stage
            
        - (readonly) `external_id` — an optional identifier used to reference
        this resource in an external system
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - (readonly) `name` — localized names of BaseLifeCycle
            
        - (readonly) `description` — localized descriptions of BaseLifeCycle
            

        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            

        ### Filters by


        `id`, `animal_type`, `cycle_code`, `external_id`


        ### Order by


        `id`, `animal_type`, `cycle_code`


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/base_life_cycles
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of base life cycle objects, where each object
        contains:
            
            - **id**: VelHerd ID of BaseLifeCycle.
                
            - **animal_type**: Species the life cycle belongs to. Can be one of `cattle`, `pigs`, `sheep`, `goats`, `horses`, `donkeys`, `mules`, `poultry`, `rabbits`, `bees`, `fish`, `camels`, `deer`, `buffalo`, `insects`.
                
            - **cycle_code**: Code of the life cycle.
                
            - **min_duration_days**: Minimal duration of the stage in days.
                
            - **max_duration_days**: Maximal duration of the stage in days.
                
            - **triggers**: Array of event codes that move an animal to this stage.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **name**: Localized names of BaseLifeCycle.
                
            - **description**: Localized descriptions of BaseLifeCycle.
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

