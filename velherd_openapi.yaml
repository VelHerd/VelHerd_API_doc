  /api/v1/time_entries:
    head:
      summary: introduction TimeEntry
      tags:
        - API endpoints
        - Time Entries
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Time Entries


        ### Purpose


        This endpoint manages worked hours of employees, optionally tied to an
        operation.


        ---


        ### TimeEntry has next parameters


        - (readonly) `id` — VelHerd ID of TimeEntry
            
        - (create only) `employee_id` — ID of Employee (`/employees`)
            
        - `work_date` — date of the work
            
        - `hours` — worked hours
            
        - `entry_type` — type of the hours
            
        - (readonly) `status` — status of the entry
            
        - `operation_id` — ID of Operation the work was for (`/operations`)
            
        - (readonly) `recorded_by_id` — ID of the VelHerd user who recorded the
        entry (the token owner)
            
        - (readonly) `confirmed_by_id` — ID of the VelHerd user who confirmed
        the entry
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - (write-only) `rate` — rate for an hour
            
        - (write-only) `notes` — free-form notes
            
        - (write-only) `description` — description of TimeEntry
            

        ### Required on create


        `employee_id`, `entry_type`, `hours`, `operation_id`, `rate`,
        `work_date`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            
        - `confirm` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/time_entries/ID/confirm
            

        ### Filters by


        `id`, `employee_id`, `work_date`, `entry_type`, `status`,
        `operation_id`, `external_id`


        ### Order by


        `id`, `work_date`


        ### Important


        - A new entry is always `draft`; it becomes `confirmed` only by the
        `confirm` action.
            
        - Fields marked (write-only) are accepted on create and update but are
        never returned and cannot be used in filters: they are personal or
        payroll data.
            
        - `recorded_by_id` is set to the token owner automatically.
            
        - `employee_id` is set on create only and is ignored on update.
            

        ### Additional actions


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/time_entries/ID/confirm


        Confirms the entry; `confirmed_by_id` is set to the token owner.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/time_entries
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of time entry objects, where each object contains:
            
            - **id**: VelHerd ID of TimeEntry.
                
            - **employee_id**: ID of Employee (`/employees`).
                
            - **work_date**: Date of the work (date `YYYY-MM-DD`).
                
            - **hours**: Worked hours (decimal, returned as a string).
                
            - **entry_type**: Type of the hours. Can be one of `regular`, `overtime`, `holiday`, `night_shift`.
                
            - **status**: Status of the entry. Can be one of `draft`, `confirmed`.
                
            - **operation_id**: ID of Operation the work was for (`/operations`).
                
            - **recorded_by_id**: ID of the VelHerd user who recorded the entry (the token owner).
                
            - **confirmed_by_id**: ID of the VelHerd user who confirmed the entry.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "time_entry",
                    "attributes": {
                        "id": 1,
                        "employee_id": 1,
                        "work_date": "2026-04-10",
                        "hours": "8.0",
                        "entry_type": "regular",
                        "status": "confirmed",
                        "operation_id": 17,
                        "recorded_by_id": 2,
                        "confirmed_by_id": 2,
                        "external_id": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00"
                    }
                },
                {
                    "id": "2",
                    "type": "time_entry",
                    "attributes": {
                        "id": 2,
                        "employee_id": 1,
                        "work_date": "2026-04-11",
                        "hours": "2.5",
                        "entry_type": "overtime",
                        "status": "draft",
                        "operation_id": null,
                        "recorded_by_id": 2,
                        "confirmed_by_id": null,
                        "external_id": "ERP-00042",
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00"
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the time entries,
        enabling clients to easily access and utilize the information.
