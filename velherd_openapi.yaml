  /api/v1/machinery_aggregates:
    head:
      summary: introduction MachineryAggregate
      tags:
        - API endpoints
        - Machinery Aggregates
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: |-
        ## API Endpoint: Machinery Aggregates

        ### Purpose

        This endpoint manages machinery aggregates — a machine class with its implement classes for one work type, carrying the output and fuel norms that tech maps, agro plans and the machinery schedule count with.

        ---

        ### MachineryAggregate has next parameters

        - (readonly) `id` — VelHerd ID of MachineryAggregate

        - `name` — name of MachineryAggregate, unique within the work type

        - `work_type_id` — ID of WorkType the norms hold for (`/work_types`)

        - `machine_type_id` — ID of MachineType that pulls the aggregate (`/machine_types`); empty for a self-propelled or an implement-only aggregate

        - `output_rate` — output norm, units of the rate basis per shift

        - `fuel_rate` — fuel norm, litres per unit of the rate basis

        - `shift_hours` — hours in a shift, `8` by default

        - `operators_count` — operators per shift, `1` by default

        - `auxiliary_workers_count` — auxiliary workers per shift, `0` by default

        - `active` — is the aggregate offered in the forms, `true` by default

        - `external_id` — an optional identifier used to reference this resource in an external system

        - `description` — description of MachineryAggregate

        - (readonly) `created_at`

        - (readonly) `updated_at`

        - (readonly) `rate_basis` — rate basis of the work type the norms are counted in

        - `machinery_aggregate_items` — array of implement classes of the aggregate, see below


        ### Required on create

        `name`, `work_type_id`

        ### Acceptable methods

        - `Ids`

        - `Single Resource`

        - `Create Resource`

        - `Update Resource`

        - `Delete Resource`


        ### Filters by

        `id`, `name`, `work_type_id`, `machine_type_id`, `active`, `external_id`

        ### Order by

        `id`, `name`

        ### Important

        - `output_rate` and `fuel_rate` are taken and returned in the **planning unit of the work type's rate basis** exactly as stored (hectares, tonnes, kilometres…): `output_rate` is units per shift, `fuel_rate` is litres per unit. They are not converted to the units the user picked in the web interface.

        - An aggregate needs a machine class or at least one implement class; a name with norms and nothing underneath is refused.

        - Only `implement` equipment classes join an aggregate; `output_rate` is dropped for a work type with the `time` basis.

        - Implement classes are sent in `machinery_aggregate_items_attributes`: a row without `id` is added, a row with `id` is changed, a row with `id` and `"_destroy": true` is removed. Rows that are not sent stay as they are.

        - An aggregate that tech map rows, agro plans or machine tasks refer to cannot be deleted: `DELETE` answers `422` with `errors`.


        ---

        ### Request Format

        - **Method**: GET

        - **URL**: {{baseUrl}}/api/{{apiVersion}}/machinery_aggregates


        ### Response Structure

        The response will contain a JSON object with the following structure:

        - **data**: An array of machinery aggregate objects, where each object contains:

            - **id**: VelHerd ID of MachineryAggregate.

            - **name**: Name of MachineryAggregate, unique within the work type.

            - **work_type_id**: ID of WorkType the norms hold for (`/work_types`).

            - **machine_type_id**: ID of MachineType that pulls the aggregate (`/machine_types`); empty for a self-propelled or an implement-only aggregate.

            - **output_rate**: Output norm, units of the rate basis per shift.

            - **fuel_rate**: Fuel norm, litres per unit of the rate basis.

            - **shift_hours**: Hours in a shift, `8` by default.

            - **operators_count**: Operators per shift, `1` by default.

            - **auxiliary_workers_count**: Auxiliary workers per shift, `0` by default.

            - **active**: Is the aggregate offered in the forms, `true` by default.

            - **external_id**: An optional identifier used to reference this resource in an external system.

            - **description**: Description of MachineryAggregate.

            - **created_at**: Created time

            - **updated_at**: Updated time

            - **rate_basis**: Rate basis of the work type the norms are counted in. Can be one of `area`, `mass`, `distance`, `volume`, `count`, `head`, `time`.

            - **machinery_aggregate_items**: Array of implement classes of the aggregate, see below.

                - `id`

                - `equipment_type_id` — implement class (`/equipment_types`)

                - `quantity` — how many units of the class the aggregate holds, `1` by default

                - `external_id`, `description`, `created_at`, `updated_at`


        - **meta**: Pagination info — `page`, `per_page`, `total_count`, `total_pages`. Pass `page[number]` and `page[size]` (default 100, max 500) to get other pages.


        ### Example Response

        ``` json
        {
            "data": [
                {
                    "id": "1",
                    "type": "machinery_aggregate",
                    "attributes": {
                        "id": 1,
                        "name": "Sowing unit 12 m",
                        "work_type_id": 4,
                        "machine_type_id": 1,
                        "output_rate": "60.0",
                        "fuel_rate": "4.5",
                        "shift_hours": "10.0",
                        "operators_count": 1,
                        "auxiliary_workers_count": 1,
                        "active": true,
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00",
                        "rate_basis": "area",
                        "machinery_aggregate_items": [
                            {
                                "id": 5,
                                "equipment_type_id": 3,
                                "quantity": 1,
                                "external_id": null,
                                "description": null,
                                "created_at": "2026-03-02T09:14:27.512+02:00",
                                "updated_at": "2026-03-02T09:14:27.512+02:00"
                            }
                        ]
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 1,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the machinery aggregates, enabling clients to easily access and utilize the information.
