  /api/v1/counterparties:
    head:
      summary: introduction Counterparty
      tags:
        - API endpoints
        - Counterparties
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Counterparties


        ### Purpose


        This endpoint manages counterparties — suppliers, buyers, landlords,
        contractors and so on.


        ---


        ### Counterparty has next parameters


        - (readonly) `id` — VelHerd ID of Counterparty
            
        - `kind` — kind of Counterparty
            
        - `roles` — array of roles of Counterparty
            
        - `status` — status of Counterparty
            
        - `name` — name of a legal entity
            
        - `last_name` — last name of a person
            
        - `first_name` — first name of a person
            
        - `middle_name` — middle name of a person
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - `tax_number` — tax number (EDRPOU or RNOKPP)
            
        - `vat_number` — VAT number
            
        - `director_name` — name of the director
            
        - `phone_number` — phone number
            
        - `email` — email
            
        - `region` — region
            
        - `district` — district
            
        - `city` — city
            
        - `street` — street
            
        - `building` — building
            
        - `postal_code` — postal code
            
        - `description` — description of Counterparty
            
        - (write-only) `date_of_birth` — date of birth
            
        - (write-only) `passport_number` — passport number
            
        - (write-only) `passport_issued_at` — passport issue date
            
        - (write-only) `passport_issued_by` — passport issuing authority
            

        ### Required on create


        `first_name`, `kind`, `last_name`, `name`, `status`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `kind`, `status`, `name`, `tax_number`, `external_id`


        ### Order by


        `id`, `name`, `last_name`


        ### Important


        - Registration details and contacts (`tax_number`, `vat_number`,
        `director_name`, `phone_number`, `email`, address and `description`) are
        returned only for `kind` = `legal_entity`. For a person or a sole
        proprietor they are accepted but never returned, and `date_of_birth`,
        `passport_number`, `passport_issued_at` and `passport_issued_by` are
        never returned at all.
            
        - Filter by `tax_number` finds only legal entities.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/counterparties
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of counterparty objects, where each object
        contains:
            
            - **id**: VelHerd ID of Counterparty.
                
            - **kind**: Kind of Counterparty. Can be one of `individual`, `sole_proprietor`, `legal_entity`.
                
            - **roles**: Array of roles of Counterparty. Can be one of `supplier`, `buyer`, `landlord`, `contractor`, `service_provider`, `other`.
                
            - **status**: Status of Counterparty. Can be one of `active`, `inactive`.
                
            - **name**: Name of a legal entity.
                
            - **last_name**: Last name of a person.
                
            - **first_name**: First name of a person.
                
            - **middle_name**: Middle name of a person.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **tax_number**: Tax number (EDRPOU or RNOKPP).
                
            - **vat_number**: VAT number.
                
            - **director_name**: Name of the director.
                
            - **phone_number**: Phone number.
                
            - **email**: Email.
                
            - **region**: Region.
                
            - **district**: District.
                
            - **city**: City.
                
            - **street**: Street.
                
            - **building**: Building.
                
            - **postal_code**: Postal code.
                
            - **description**: Description of Counterparty.
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "counterparty",
                    "attributes": {
                        "id": 1,
                        "kind": "legal_entity",
                        "roles": [
                            "supplier"
                        ],
                        "status": "active",
                        "name": "Agro Supply LLC",
                        "last_name": null,
                        "first_name": null,
                        "middle_name": null,
                        "external_id": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00",
                        "tax_number": "12345678",
                        "vat_number": "123456789012",
                        "director_name": "Ivan Bondar",
                        "phone_number": "+380441234567",
                        "email": "office@agro-supply.example",
                        "region": "Kyivska",
                        "district": "Fastivskyi",
                        "city": "Fastiv",
                        "street": "Shevchenka",
                        "building": "10",
                        "postal_code": "08500",
                        "description": null
                    }
                },
                {
                    "id": "2",
                    "type": "counterparty",
                    "attributes": {
                        "id": 2,
                        "kind": "individual",
                        "roles": [
                            "landlord"
                        ],
                        "status": "active",
                        "name": null,
                        "last_name": "Shevchenko",
                        "first_name": "Petro",
                        "middle_name": "Ivanovych",
                        "external_id": "ERP-00042",
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00",
                        "tax_number": "12345678",
                        "vat_number": "123456789012",
                        "director_name": "Ivan Bondar",
                        "phone_number": "+380441234567",
                        "email": "office@agro-supply.example",
                        "region": "Kyivska",
                        "district": "Fastivskyi",
                        "city": "Fastiv",
                        "street": "Shevchenka",
                        "building": "10",
                        "postal_code": "08500",
                        "description": null
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the counterparties,
        enabling clients to easily access and utilize the information.
