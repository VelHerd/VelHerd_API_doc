  /api/v1/resources:
    head:
      summary: introduction Resource
      tags:
        - API endpoints
        - Resources
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Resources


        ### Purpose


        This endpoint manages inventory items — seeds, fertilizers, chemicals,
        feed, medicines, fuel, spare parts and so on.


        ---


        ### Resource has next parameters


        - (readonly) `id` — VelHerd ID of Resource
            
        - `name` — name of Resource
            
        - `category` — category of Resource
            
        - `manufacturer` — manufacturer
            
        - `brand` — brand
            
        - `resource_code` — code of Resource
            
        - `unit_id` — ID of Unit the resource is counted in (`/units`)
            
        - `packaging` — packaging
            
        - `active` — is Resource active
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of Resource
            
        - `details` — category-specific attributes, see below
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - `crop_id` — ID of Crop, for seeds (`/crops`)
            

        ### Required on create


        `category`, `name`, `packaging`, `unit_id`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `name`, `category`, `unit_id`, `crop_id`, `active`,
        `resource_code`, `external_id`


        ### Order by


        `id`, `name`, `category`


        ### Important


        - `details` accepts only the keys defined for the category. **seed**:
        `maturity_group` (`ultra_early`, `early`, `mid_early`, `mid`,
        `mid_late`, `late`), `maturation_period_days`, `growing_technology`
        (`classic`, `express`, `clearfield`, `clearfield_plus`),
        `tillering_coefficient`, `recommended_harvest_type` (`direct`,
        `separate`). **fertilizer**: `form` (`granular`, `liquid`, `organic`,
        `other`), `origin` (`mineral`, `organic`, `other`), `composition_type`
        (`nitrogen`, `phosphorus`, `potassium`, `complex`, `micro`, `other`),
        `nutrients` (object), `density_kg_per_l`, `ph` (0–14), `solubility`,
        `registration_number`, `registration_valid_until`. **chemical**: `type`
        (`herbicide`, `fungicide`, `insecticide`, `adjuvant` and others),
        `action_mode`, `toxicity_class`, `formulation`, `active_ingredients`
        (array of `{name, value}`), `bee_isolation_period_days`,
        `residual_activity_period_days`, `pre_harvest_interval_days`,
        `max_treatments_per_season`, `registration_number`,
        `registration_valid_until`. Other categories have no details.
            
        - An update without `details` keeps the stored details.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/resources
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of resource objects, where each object contains:
            
            - **id**: VelHerd ID of Resource.
                
            - **name**: Name of Resource.
                
            - **category**: Category of Resource. Can be one of `seed`, `fertilizer`, `chemical`, `feed`, `product`, `vet_medicine`, `fuel`, `oil_technical_fluids`, `spare_parts`, `other`.
                
            - **manufacturer**: Manufacturer.
                
            - **brand**: Brand.
                
            - **resource_code**: Code of Resource.
                
            - **unit_id**: ID of Unit the resource is counted in (`/units`).
                
            - **packaging**: Packaging. Can be one of `bag`, `canister`, `bottle`, `blister`, `vial_dispenser`, `ampoule`, `jar`, `sachet`, `pallet`, `crate`, `roll`, `spool`, `other`.
                
            - **active**: Is Resource active (`true` or `false`).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of Resource.
                
            - **details**: Category-specific attributes, see below.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **crop_id**: ID of Crop, for seeds (`/crops`).
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
