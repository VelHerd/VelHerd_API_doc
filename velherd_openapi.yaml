                        "position": 1,
                        "planned_sowing_date": "2025-09-25",
                        "sowing_date": "2025-09-27",
                        "planned_harvest_date": "2026-07-15",
                        "harvest_date": null,
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00",
                        "crop_structure_plan_id": null
                    }
                },
                {
                    "id": "2",
                    "type": "crop_rotation",
                    "attributes": {
                        "id": 2,
                        "field_id": 1,
                        "production_cycle_id": 4,
                        "field_shape_id": 1,
                        "resource_id": null,
                        "status": "planned",
                        "approved_by_id": null,
                        "approved_at": null,
                        "position": 2,
                        "planned_sowing_date": "2026-04-20",
                        "sowing_date": null,
                        "planned_harvest_date": "2026-09-20",
                        "harvest_date": null,
                        "external_id": "ERP-00042",
                        "description": null,
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00",
                        "crop_structure_plan_id": null
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the crop rotations,
        enabling clients to easily access and utilize the information.
