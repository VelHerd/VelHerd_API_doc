            type: string
      responses: {}
      description: >-
        ## API Endpoint: Feeds


        ### Purpose


        This endpoint manages feedings — planned and done feeding of an animal
        or of a farm unit item (a group of animals in one place).


        ---


        ### Feed has next parameters


        - (readonly) `id` — VelHerd ID of Feed
            
        - `feed_ration_id` — ID of FeedRation (`/feed_rations`)
            
        - (readonly) `user_id` — ID of the VelHerd user who created the feeding
        (the token owner)
            
        - `feedable_type` — what was fed
            
        - `feedable_id` — ID of Animal or FarmUnitItem that was fed
            
        - `fed_at` — date and time of the feeding
            
        - `status` — status of Feed
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of Feed
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - `feed_items` — array of fed resources, see below
            

        ### Required on create


        `fed_at`, `feedable_id`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `feed_ration_id`, `feedable_type`, `feedable_id`, `status`,
        `external_id`


        ### Order by


        `id`, `fed_at`


        ### Important


        - `user_id` is set to the token owner automatically.
            
        - Nested rows are created, changed and removed through
        `feed_items_attributes`: a row without `id` is added, a row with `id` is
        changed, a row with `id` and `"_destroy": true` is removed. Rows that
        are not sent stay as they are.
            
        - Quantities of items are taken and returned in the unit of each item
        (`unit_id`).
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/feeds
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of feed objects, where each object contains:
            
            - **id**: VelHerd ID of Feed.
                
            - **feed_ration_id**: ID of FeedRation (`/feed_rations`).
                
            - **user_id**: ID of the VelHerd user who created the feeding (the token owner).
                
            - **feedable_type**: What was fed. Can be one of `Animal`, `FarmUnitItem`.
                
            - **feedable_id**: ID of Animal or FarmUnitItem that was fed.
                
            - **fed_at**: Date and time of the feeding (date and time, ISO 8601).
                
            - **status**: Status of Feed. Can be one of `draft`, `planned`, `done`, `canceled`.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of Feed.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **feed_items**: Array of fed resources, see below.
                
                - `id`
                    
                - `resource_id` — fed resource (`/resources`)
                    
                - `unit_id` — unit of the quantities (`/units`)
                    
                - `planned_quantity`, `actual_quantity` — in the unit of the item
                    
                - `stock_movement_id` — (readonly) stock movement written for the item
                    
                - `position`, `external_id`, `description`
                    

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

