        ### Order by


        `id`, `name`


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/farm_unit_items
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of farm unit item objects, where each object
        contains:
            
            - **id**: VelHerd ID of FarmUnitItem.
                
            - **name**: Name of FarmUnitItem.
                
            - **item_type**: Type of the item. Can be one of `animals`, `fields`, `machines`, `warehouses`.
                
            - **farm_unit_id**: ID of FarmUnit (`/farm_units`).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of FarmUnitItem.
                
            - **active**: Is FarmUnitItem active (`true` or `false`).
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


