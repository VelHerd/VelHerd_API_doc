  /api/v1/tech_maps:
    head:
      summary: introduction TechMap
      tags:
        - API endpoints
        - Tech Maps
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: |-
        ## API Endpoint: Tech Maps

        ### Purpose

        This endpoint manages tech maps — how a crop is grown: the ordered works with their machinery norms and recipes, independent of the season. The rows live in `/tech_map_rows`. A map without a crop is a library map: a source of rows for other maps, never deployed itself.

        ---

        ### TechMap has next parameters

        - (readonly) `id` — VelHerd ID of TechMap

        - `name` — name of TechMap, unique for the crop and the predecessor

        - `crop_id` — ID of Crop the map grows (`/crops`); empty for a library map

        - `predecessor_crop_id` — ID of Crop the map follows (`/crops`), not the crop itself

        - (readonly) `status` — status of TechMap

        - (readonly) `approved_by_id` — ID of the VelHerd user who approved it

        - (readonly) `approved_at` — when it was approved

        - `planned_area` — default crop area the map is read for, base area unit

        - `fuel_resource_id` — ID of Resource of the `fuel` category the map is priced by (`/resources`)

        - `external_id` — an optional identifier used to reference this resource in an external system

        - `description` — description of TechMap

        - (readonly) `created_at`

        - (readonly) `updated_at`


        ### Required on create

        `name`

        ### Acceptable methods

        - `Ids`

        - `Single Resource`

        - `Create Resource`

        - `Update Resource`

        - `Delete Resource`

        - `approve` — `POST` {{baseUrl}}/api/{{apiVersion}}/tech_maps/ID/approve

        - `archive` — `POST` {{baseUrl}}/api/{{apiVersion}}/tech_maps/ID/archive

        - `compose` — `POST` {{baseUrl}}/api/{{apiVersion}}/tech_maps/ID/compose


        ### Filters by

        `id`, `name`, `crop_id`, `predecessor_crop_id`, `status`, `external_id`

        ### Order by

        `id`, `name`

        ### Important

        - `planned_area` are taken and returned in **base units** (the unit with `is_base` = `true` for its unit type, see `/units`), not in the units the user picked in the web interface.

        - The status cannot be changed through `update`; a new map is `draft` and moves only by `approve` and `archive`.

        - Deleting a map deletes its rows.


        ### Additional actions

        #### `POST` {{baseUrl}}/api/{{apiVersion}}/tech_maps/ID/approve

        Moves the map to `approved`; `approved_by_id` is set to the token owner. Only an approved map of a crop may give birth to agro plans.

        Response: `200 OK` with the updated record in the same format as **Single Resource**. An action that is not allowed from the current status returns `422` with `errors`.

        #### `POST` {{baseUrl}}/api/{{apiVersion}}/tech_maps/ID/archive

        Moves the map to `archived`.

        Response: `200 OK` with the updated record in the same format as **Single Resource**. An action that is not allowed from the current status returns `422` with `errors`.

        #### `POST` {{baseUrl}}/api/{{apiVersion}}/tech_maps/ID/compose

        Copies every row of another map (typically a library map of shared works) into this one, with recipes and norms; the copies drop the `base` flag and remember the source map in `source_tech_map_id`. All or nothing: a row that cannot be copied stops the whole copy.

        Response: `200 OK` with the map in the same format as **Single Resource** and `meta.rows_count` — how many rows were added. A map copied into itself or a row that cannot be copied returns `422` with `errors`.

        ---

        ### Request Format

        - **Method**: GET

        - **URL**: {{baseUrl}}/api/{{apiVersion}}/tech_maps


        ### Response Structure

        The response will contain a JSON object with the following structure:

        - **data**: An array of tech map objects, where each object contains:

            - **id**: VelHerd ID of TechMap.

            - **name**: Name of TechMap, unique for the crop and the predecessor.

            - **crop_id**: ID of Crop the map grows (`/crops`); empty for a library map.

            - **predecessor_crop_id**: ID of Crop the map follows (`/crops`), not the crop itself.

            - **status**: Status of TechMap. Can be one of `draft`, `approved`, `archived`.

            - **approved_by_id**: ID of the VelHerd user who approved it.

            - **approved_at**: When it was approved (date and time, ISO 8601).

            - **planned_area**: Default crop area the map is read for, base area unit.

            - **fuel_resource_id**: ID of Resource of the `fuel` category the map is priced by (`/resources`).

            - **external_id**: An optional identifier used to reference this resource in an external system.

            - **description**: Description of TechMap.

            - **created_at**: Created time

            - **updated_at**: Updated time


        - **meta**: Pagination info — `page`, `per_page`, `total_count`, `total_pages`. Pass `page[number]` and `page[size]` (default 100, max 500) to get other pages.


        ### Example Response

        ``` json
        {
            "data": [
                {
                    "id": "1",
                    "type": "tech_map",
                    "attributes": {
                        "id": 1,
                        "name": "Winter wheat after sunflower",
                        "crop_id": 3,
                        "predecessor_crop_id": 5,
                        "status": "approved",
                        "approved_by_id": 2,
                        "approved_at": "2026-02-10T11:20:00.000+02:00",
                        "planned_area": "1200000.0",
                        "fuel_resource_id": 12,
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00"
                    }
                },
                {
                    "id": "7",
                    "type": "tech_map",
                    "attributes": {
                        "id": 7,
                        "name": "Shared autumn works",
                        "crop_id": null,
                        "predecessor_crop_id": null,
