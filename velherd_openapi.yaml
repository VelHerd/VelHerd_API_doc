            type: string
      responses: {}
      description: |-
        ## API Endpoint: Equipment Location Assignments

        ### Purpose

        This endpoint manages the assignments of equipment to farm unit items (machine yards) for a period of time. Only assignments of equipment are visible and changed here.

        ---

        ### EquipmentLocationAssignment has next parameters

        - (readonly) `id` — VelHerd ID of EquipmentLocationAssignment

        - `farm_unit_item_id` — ID of FarmUnitItem of the `machines` type the record is assigned to (`/farm_unit_items`)

        - (readonly) `assignable_type` — type of the assigned record, always `Equipment`

        - `assignable_id` — ID of Equipment that is assigned (`/equipments`)

        - `start_at` — start of the assignment

        - `end_at` — end of the assignment, empty while it lasts

        - `assignment_type` — type of the assignment

        - `external_id` — an optional identifier used to reference this resource in an external system

        - `description` — description of EquipmentLocationAssignment

        - (readonly) `created_at`

        - (readonly) `updated_at`


        ### Required on create

        `assignable_id`, `assignment_type`, `farm_unit_item_id`, `start_at`

        ### Acceptable methods

        - `Ids`

        - `Single Resource`

        - `Create Resource`

        - `Update Resource`

        - `Delete Resource`


        ### Filters by

        `id`, `assignable_id`, `farm_unit_item_id`, `assignment_type`, `external_id`

        ### Order by

        `id`, `start_at`

        ### Important

        - `assignable_type` is set to `Equipment` automatically and does not need to be sent.

        - The farm unit item must be of the `machines` type (`item_type` in `/farm_unit_items`); a barn or a field group is refused with `422`.


        ---

        ### Request Format

        - **Method**: GET

        - **URL**: {{baseUrl}}/api/{{apiVersion}}/equipment_location_assignments


        ### Response Structure

        The response will contain a JSON object with the following structure:

        - **data**: An array of equipment location assignment objects, where each object contains:

            - **id**: VelHerd ID of EquipmentLocationAssignment.

            - **farm_unit_item_id**: ID of FarmUnitItem of the `machines` type the record is assigned to (`/farm_unit_items`).

            - **assignable_type**: Type of the assigned record, always `Equipment`.

            - **assignable_id**: ID of Equipment that is assigned (`/equipments`).

            - **start_at**: Start of the assignment (date and time, ISO 8601).

            - **end_at**: End of the assignment, empty while it lasts (date and time, ISO 8601).

            - **assignment_type**: Type of the assignment. Can be one of `permanent`, `temporary`, `lease`, `operation`, `storage`, `other`.

            - **external_id**: An optional identifier used to reference this resource in an external system.

            - **description**: Description of EquipmentLocationAssignment.

            - **created_at**: Created time

            - **updated_at**: Updated time


        - **meta**: Pagination info — `page`, `per_page`, `total_count`, `total_pages`. Pass `page[number]` and `page[size]` (default 100, max 500) to get other pages.


        ### Example Response

        ``` json
        {
            "data": [
                {
                    "id": "2",
                    "type": "location_assignment",
                    "attributes": {
                        "id": 2,
                        "farm_unit_item_id": 7,
                        "assignable_type": "Equipment",
                        "assignable_id": 1,
                        "start_at": "2026-03-01T08:00:00.000+02:00",
                        "end_at": null,
                        "assignment_type": "storage",
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00"
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 1,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the equipment location assignments, enabling clients to easily access and utilize the information.
