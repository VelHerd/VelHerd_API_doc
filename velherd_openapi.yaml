        - `farm_unit_id` — ID of FarmUnit (`/farm_units`)
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of FarmUnitItem
            
        - `active` — is FarmUnitItem active
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


