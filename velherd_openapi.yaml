  /api/v1/stock_movements:
    head:
      summary: introduction StockMovement
      tags:
        - API endpoints
        - Stock Movements
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Stock Movements


        ### Purpose


        This endpoint manages stock movements — incoming, outgoing, adjustment
        and transfer of resources between warehouses, and their reversal
        (storno).


        ---


        ### StockMovement has next parameters


        - (readonly) `id` — VelHerd ID of StockMovement
            
        - `name` — name of StockMovement
            
        - (readonly) `operation_id` — UUID that ties together the rows written
        by one request
            
        - `operation_type` — what was done
            
        - (readonly) `movement_type` — type of this row
            
        - `direction` — does the row add to (`in`) or take from (`out`) the
        warehouse
            
        - `resource_id` — ID of Resource (`/resources`)
            
        - `warehouse_id` — ID of the warehouse of this row (`/farm_unit_items`)
            
        - `from_warehouse_id` — ID of the source warehouse of a transfer
            
        - `to_warehouse_id` — ID of the target warehouse of a transfer
            
        - (readonly) `stock_batch_id` — ID of StockBatch (`/stock_batches`)
            
        - (readonly) `source_type` — type of the record the movement was written
        for
            
        - (readonly) `source_id` — ID of the record the movement was written for
            
        - (readonly) `user_id` — ID of the VelHerd user who created the movement
        (the token owner)
            
        - `quantity` — quantity
            
        - `occurred_at` — when the movement happened
            
        - `reason` — reason
            
        - (readonly) `system` — was StockMovement created by the system rather
        than by a person
            
        - `locked` — is StockMovement locked against editing
            
        - (readonly) `original_movement_id` — ID of the movement a storno
        reverses
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of StockMovement
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - (write-only) `details` — batch attributes (object), see below
            
        - (write-only) `storno_of` — ID of the movement to reverse, see below
            

        ### Required on create


        `operation_type`, `resource_id`, `warehouse_id`, `quantity`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            

        ### Filters by


        `id`, `resource_id`, `warehouse_id`, `stock_batch_id`, `operation_id`,
        `operation_type`, `movement_type`, `direction`, `locked`, `external_id`


        ### Order by


        `id`, `occurred_at`


        ### Important


        - `operation_type` on create can be `incoming`, `outgoing`, `adjustment`
        or `transfer`. A storno is created by sending `storno_of` with the ID of
        the movement to reverse; then only `name`, `occurred_at`, `reason`,
        `external_id` and `description` are taken from the request.
            
        - One request can write several rows — an outgoing movement is split
        across batches and a transfer writes both legs — so create answers `201
        Created` with an **array** of all written rows, tied together by
        `operation_id`.
            
        - An update changes only `name`, `occurred_at`, `reason`, `locked`,
        `external_id`, `description` and batch `details`. Movements cannot be
        deleted: a wrong movement is reversed with a storno.
            
        - `details` are batch attributes checked against the resource category.
        **seed**: `reproduction`, `harvest_year`, `test_date`,
        `thousand_seed_weight_grams`, `germination` (0–100), `purity` (0–100),
        `seeds_per_sowing_unit`, `moisture` (0–100), `vigor` (0–100),
        `is_treated`, `treatment_agent`. **chemical**: `sale_until`. Other
        categories have no batch details.
            
        - `user_id` is set to the token owner automatically.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/stock_movements
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of stock movement objects, where each object
        contains:
            
            - **id**: VelHerd ID of StockMovement.
                
            - **name**: Name of StockMovement.
                
            - **operation_id**: UUID that ties together the rows written by one request.
                
            - **operation_type**: What was done. Can be one of `incoming`, `outgoing`, `adjustment`, `transfer`, `storno`.
                
            - **movement_type**: Type of this row. Can be one of `incoming`, `outgoing`, `adjustment`, `transfer`, `storno`.
                
            - **direction**: Does the row add to (`in`) or take from (`out`) the warehouse. Can be one of `in`, `out`.
                
            - **resource_id**: ID of Resource (`/resources`).
                
            - **warehouse_id**: ID of the warehouse of this row (`/farm_unit_items`).
                
            - **from_warehouse_id**: ID of the source warehouse of a transfer.
                
            - **to_warehouse_id**: ID of the target warehouse of a transfer.
                
            - **stock_batch_id**: ID of StockBatch (`/stock_batches`).
                
            - **source_type**: Type of the record the movement was written for.
                
            - **source_id**: ID of the record the movement was written for.
                
            - **user_id**: ID of the VelHerd user who created the movement (the token owner).
                
            - **quantity**: Quantity (decimal, returned as a string).
                
            - **occurred_at**: When the movement happened (date and time, ISO 8601).
                
            - **reason**: Reason.
                
            - **system**: Was StockMovement created by the system rather than by a person (`true` or `false`).
                
            - **locked**: Is StockMovement locked against editing (`true` or `false`).
                
            - **original_movement_id**: ID of the movement a storno reverses.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of StockMovement.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "stock_movement",
                    "attributes": {
                        "id": 1,
                        "name": "Seeds purchase",
                        "operation_id": "6f1c2b8e-7a51-4b0e-9c3d-2f8a1e5d4c71",
                        "operation_type": "incoming",
