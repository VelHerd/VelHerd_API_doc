                        "end_date": null,
                        "end_reason": null,
                        "position": "Chief agronomist",
                        "contract_type": "labor_contract",
                        "work_schedule": "full_time",
                        "probation_end_date": null,
                        "external_id": "ERP-00042",
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00"
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the employment periods,
        enabling clients to easily access and utilize the information.
