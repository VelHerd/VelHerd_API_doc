        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - (readonly) `file_ids` — IDs of attached scans, for `removed_file_ids`
            
        - (write-only) `name` — name of the document
            
        - (write-only) `number` — number of the document
            
        - (write-only) `notes` — free-form notes
            
        - (write-only) `description` — description of EmployeeDocument
            
        - (write-only) `file_signed_ids` — array of `signed_id` from **Direct
        Uploads** to attach
            
        - (write-only) `removed_file_ids` — array of IDs of attached files to
