  /api/v1/operations:
    head:
      summary: introduction Operation
      tags:
        - API endpoints
        - Operations
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Operations


        ### Purpose


        This endpoint manages operations — works done on a field, an animal, a
        farm unit or a farm unit item, with their resources (applications). An
        agro operation (`target_type` = `Field`) also carries its agronomic
        details in `agro_operation`.


        ---


        ### Operation has next parameters


        - (readonly) `id` — VelHerd ID of Operation
            
        - (create only) `target_type` — what the operation is done on
            
        - (create only) `target_id` — ID of the record the operation is done on
            
        - `name` — name of Operation
            
        - `work_type_id` — ID of WorkType (`/work_types`)
            
        - `season_id` — ID of Season (`/seasons`)
            
        - (create only) `status` — status of Operation
            
        - (readonly) `timeliness` — was it done on time, set by the system
            
        - `planned_start_at` — planned start
            
        - `planned_finish_at` — planned finish
            
        - (create only) `actual_start_at` — actual start
            
        - (create only) `actual_finish_at` — actual finish
            
        - `planned_cost` — planned cost
            
        - `actual_cost` — actual cost
            
        - `currency` — currency
            
        - `work_number` — number of the work
            
        - `accounting_code` — accounting code
            
        - (readonly) `data_source` — where the data came from
            
        - (readonly) `created_by_id` — ID of the VelHerd user who created the
        record (the token owner)
            
        - (readonly) `confirmed_by_id` — ID of the VelHerd user who confirmed it
            
        - (readonly) `confirmed_at` — when it was confirmed
            
        - (readonly) `cancelled_by_id` — ID of the VelHerd user who cancelled it
            
        - (readonly) `cancelled_at` — when it was cancelled
            
        - (readonly) `cancel_reason` — reason of the cancellation
            
        - (readonly) `reopened_by_id` — ID of the VelHerd user who reopened it
            
        - (readonly) `reopened_at` — when it was reopened
            
        - (readonly) `reopen_reason` — reason of the reopening
            
        - (readonly) `detailable_type` — type of the details, `AgroOperation` or
        empty
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of Operation
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - `agro_operation` — agronomic details of an agro operation (object),
        see below
            
        - `applications` — array of resources of the operation, see below
            

        ### Required on create


        `currency`, `name`, `planned_finish_at`, `planned_start_at`,
        `season_id`, `status`, `work_type_id`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            
        - `confirm` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/operations/ID/confirm
            
        - `start` — `POST` {{baseUrl}}/api/{{apiVersion}}/operations/ID/start
            
        - `complete` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/operations/ID/complete
            
        - `revert` — `POST` {{baseUrl}}/api/{{apiVersion}}/operations/ID/revert
            
        - `cancel` — `POST` {{baseUrl}}/api/{{apiVersion}}/operations/ID/cancel
            

        ### Filters by


        `id`, `target_type`, `target_id`, `work_type_id`, `season_id`, `status`,
        `timeliness`, `work_number`, `external_id`


        ### Order by


        `id`, `planned_start_at`, `planned_finish_at`


        ### Important


        - Quantities, areas and spray rates are taken and returned in **base
        units** (the unit with `is_base` = `true` for its unit type, see
        `/units`), not in the units the user picked in the web interface.
            
        - The status cannot be changed through `update`; it moves only by the
        additional actions below. On create only, `status`, `actual_start_at`
        and `actual_finish_at` may be sent, so work done earlier can be entered
        at once as `done`.
            
        - `target_type` and `target_id` are set on create only and are ignored
        on update.
            
        - `created_by_id` is set to the token owner automatically.
            
        - Details are sent in `agro_operation_attributes`. Nested rows are
        created, changed and removed through `applications_attributes`: a row
        without `id` is added, a row with `id` is changed, a row with `id` and
        `"_destroy": true` is removed. Rows that are not sent stay as they are.
            
        - Status flow: `draft` → `confirm` → `planned` → `start` → `in_progress`
        → `complete` → `done`; `revert` moves `in_progress` or `done` back to
        `planned`; `cancel` works from any status except `cancelled`.
            

        ### Additional actions


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/operations/ID/confirm


        Moves a `draft` operation to `planned`.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/operations/ID/start


        Moves a `planned` operation to `in_progress`.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/operations/ID/complete


        Moves an `in_progress` operation to `done`. `actual_start_at` and
        `actual_finish_at` are optional.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/operations/ID/revert


        Moves an `in_progress` or `done` operation back to `planned`.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        #### `POST` {{baseUrl}}/api/{{apiVersion}}/operations/ID/cancel


        Cancels the operation. `cancel_reason` is optional.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/operations
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of operation objects, where each object contains:
            
            - **id**: VelHerd ID of Operation.
                
            - **target_type**: What the operation is done on. Can be one of `Field`, `Animal`, `FarmUnit`, `FarmUnitItem`.
                
            - **target_id**: ID of the record the operation is done on.
                
            - **name**: Name of Operation.
                
            - **work_type_id**: ID of WorkType (`/work_types`).
                
            - **season_id**: ID of Season (`/seasons`).
                
            - **status**: Status of Operation. Can be one of `draft`, `planned`, `in_progress`, `done`, `cancelled`.
                
            - **timeliness**: Was it done on time, set by the system. Can be one of `early`, `on_time`, `late`.
                
            - **planned_start_at**: Planned start (date and time, ISO 8601).
                
            - **planned_finish_at**: Planned finish (date and time, ISO 8601).
                
            - **actual_start_at**: Actual start (date and time, ISO 8601).
                
            - **actual_finish_at**: Actual finish (date and time, ISO 8601).
                
            - **planned_cost**: Planned cost (decimal, returned as a string).
                
            - **actual_cost**: Actual cost (decimal, returned as a string).
                
            - **currency**: Currency. Can be one of `usd`, `eur`, `uah`, `gbp`.
                
            - **work_number**: Number of the work.
                
            - **accounting_code**: Accounting code.
                
            - **data_source**: Where the data came from.
                
            - **created_by_id**: ID of the VelHerd user who created the record (the token owner).
                
            - **confirmed_by_id**: ID of the VelHerd user who confirmed it.
                
            - **confirmed_at**: When it was confirmed (date and time, ISO 8601).
                
            - **cancelled_by_id**: ID of the VelHerd user who cancelled it.
                
            - **cancelled_at**: When it was cancelled (date and time, ISO 8601).
                
            - **cancel_reason**: Reason of the cancellation.
                
            - **reopened_by_id**: ID of the VelHerd user who reopened it.
                
            - **reopened_at**: When it was reopened (date and time, ISO 8601).
                
            - **reopen_reason**: Reason of the reopening.
                
            - **detailable_type**: Type of the details, `AgroOperation` or empty. Can be one of `AgroOperation`.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of Operation.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **agro_operation**: Agronomic details of an agro operation (object), see below.
                
                - `id` — the agro operation ID used by the bulk actions of **Agro Plans**
                    
                - `crop_rotation_id` — crop rotation row (`/crop_rotations`)
                    
                - `responsible_id` — responsible Employee
                    
                - `planned_area`, `actual_area`, `planned_spray_rate`, `actual_spray_rate` — in base units
                    
                - `source_template_id`, (readonly) `agro_plan_id`, `operation_number`, `external_id`, `description`
                    
            - **applications**: Array of resources of the operation, see below.
                
                - `id`
                    
                - `resource_id` — applied resource (`/resources`)
                    
                - `warehouse_id` — warehouse the resource is taken from (`/farm_unit_items`)
                    
                - `application_basis` — `quantity`, `per_area` or `per_solution`
                    
                - `in_tank_mix` — is it part of a tank mix
                    
                - `planned_quantity`, `actual_quantity`, `planned_area`, `actual_area` — in base units
                    
                - `unit_price`, `currency`, `external_id`, `description`
                    

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "operation",
                    "attributes": {
                        "id": 1,
                        "target_type": "Field",
