  /api/v1/health_records:
    head:
      summary: introduction HealthRecord
      tags:
        - API endpoints
        - Health Records
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Health Records


        ### Purpose


        This endpoint manages veterinary records of animals — planned and done
        examinations, treatments and procedures.


        ---


        ### HealthRecord has next parameters


        - (readonly) `id` — VelHerd ID of HealthRecord
            
        - `animal_id` — ID of Animal (`/animals`)
            
        - `planned_date` — planned date
            
        - `event_time` — when it actually happened
            
        - `record_status` — status of the record
            
        - `health_status` — health status of the animal
            
        - `symptoms` — symptoms
            
        - `diagnosis` — diagnosis
            
        - `treatment` — treatment
            
        - (readonly) `physical_data` — measured physical data (object)
            
        - (readonly) `medications` — used medications (array)
            
        - `record_type` — type of the record
            
        - `procedure_keys` — array of procedure codes; they must belong to
        `record_type`
            
        - `cost` — cost
            
        - `currency` — currency
            
        - `veterinarian_id` — ID of the veterinarian (VelHerd user)
            
        - (readonly) `user_id` — ID of the VelHerd user who created the record
        (the token owner)
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - `description` — description of HealthRecord
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            

        ### Required on create


        `animal_id`, `currency`, `event_time`, `health_status`, `planned_date`,
        `record_status`, `record_type`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `animal_id`, `record_status`, `health_status`, `record_type`,
        `planned_date`, `external_id`


        ### Order by


        `id`, `planned_date`, `event_time`


        ### Important


        - `user_id` is set to the token owner automatically.
            
        - Procedure codes by `record_type`: **basic_clinical_examination** —
        `visual_inspection_of_general_condition`,
        `measurement_of_body_temperature`, `body_condition_score`, …;
        **diagnostic_procedures** — `blood_sampling`, `ultrasound`,
        `rectal_exam`, …; **therapeutic_and_preventive_procedures** —
        `vaccination`, `revaccination`, `deworming`, …;
        **orthopedic_and_hoof_procedures** — `hoof_trimming`, …;
        **reproductive_procedures** — `pregnancy_diagnosis`,
        `artificial_insemination`, …; **surgical_and_invasive_procedures** —
        `castration`, `dehorning`, …; **special_procedures_for_cattle** —
        `mastitis_treatment`, …; **administrative_and_record_procedures** —
        `scheduled_exam`, …; **emergency_and_critical_procedures** —
        `emergency_exam`, …. An unknown code returns `422`.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/health_records
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of health record objects, where each object
        contains:
            
            - **id**: VelHerd ID of HealthRecord.
                
            - **animal_id**: ID of Animal (`/animals`).
                
            - **planned_date**: Planned date (date `YYYY-MM-DD`).
                
            - **event_time**: When it actually happened (date and time, ISO 8601).
                
            - **record_status**: Status of the record. Can be one of `planned`, `in_progress`, `done`, `canceled`.
                
            - **health_status**: Health status of the animal. Can be one of `critical`, `poor`, `fair`, `good`, `excellent`, `other`.
                
            - **symptoms**: Symptoms.
                
            - **diagnosis**: Diagnosis.
                
            - **treatment**: Treatment.
                
            - **physical_data**: Measured physical data (object).
                
            - **medications**: Used medications (array).
                
            - **record_type**: Type of the record. Can be one of `basic_clinical_examination`, `diagnostic_procedures`, `therapeutic_and_preventive_procedures`, `orthopedic_and_hoof_procedures`, `reproductive_procedures`, `surgical_and_invasive_procedures`, `special_procedures_for_cattle`, `administrative_and_record_procedures`, `emergency_and_critical_procedures`.
                
            - **procedure_keys**: Array of procedure codes; they must belong to `record_type`.
                
            - **cost**: Cost (decimal, returned as a string).
                
            - **currency**: Currency. Can be one of `usd`, `eur`, `uah`, `gbp`.
                
            - **veterinarian_id**: ID of the veterinarian (VelHerd user).
                
            - **user_id**: ID of the VelHerd user who created the record (the token owner).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of HealthRecord.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "health_record",
                    "attributes": {
                        "id": 1,
                        "animal_id": 12,
                        "planned_date": "2026-04-14",
                        "event_time": null,
                        "record_status": "planned",
                        "health_status": null,
                        "symptoms": null,
                        "diagnosis": null,
                        "treatment": null,
                        "physical_data": {},
                        "medications": [],
                        "record_type": "therapeutic_and_preventive_procedures",
                        "procedure_keys": [
                            "vaccination"
                        ],
                        "cost": "250.0",
                        "currency": "uah",
                        "veterinarian_id": null,
                        "user_id": 2,
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00"
                    }
                },
                {
                    "id": "2",
                    "type": "health_record",
                    "attributes": {
                        "id": 2,
                        "animal_id": 12,
                        "planned_date": "2026-05-02",
                        "event_time": "2026-05-02T10:15:00.000+03:00",
                        "record_status": "done",
                        "health_status": "good",
                        "symptoms": null,
                        "diagnosis": null,
                        "treatment": null,
                        "physical_data": {},
                        "medications": [],
                        "record_type": "basic_clinical_examination",
                        "procedure_keys": [
                            "measurement_of_body_temperature"
                        ],
                        "cost": null,
                        "currency": null,
                        "veterinarian_id": null,
                        "user_id": 2,
                        "external_id": "ERP-00042",
                        "description": null,
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00"
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the health records,
        enabling clients to easily access and utilize the information.
