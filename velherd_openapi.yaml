  /api/v1/resource_issue_orders:
    head:
      summary: introduction ResourceIssueOrder
      tags:
        - API endpoints
        - Resource Issue Orders
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Resource Issue Orders


        ### Purpose


        This endpoint manages resource issue orders — requests to issue
        resources from a warehouse for operations. Stock leaves the warehouse
        only when an approved order is issued.


        ---


        ### ResourceIssueOrder has next parameters


        - (readonly) `id` — VelHerd ID of ResourceIssueOrder
            
        - `number` — number of the order
            
        - `document_date` — date of the document
            
        - (readonly) `warehouse_id` — ID of the warehouse the resources are
        issued from (`/farm_unit_items`)
            
        - (readonly) `status` — status of ResourceIssueOrder
            
        - (readonly) `approved_by_id` — ID of the VelHerd user who approved the
        record
            
        - (readonly) `approved_at` — when the order was approved
            
        - (readonly) `issued_by_id` — ID of the VelHerd user who issued the
        order
            
        - (readonly) `issued_at` — when the order was issued
            
        - (readonly) `cancelled_by_id` — ID of the VelHerd user who cancelled it
            
        - (readonly) `cancelled_at` — when the order was cancelled
            
        - (readonly) `cancel_reason` — reason of the cancellation
            
        - (readonly) `operation_uuid` — UUID of the stock movements written on
        issue
            
        - (readonly) `external_id` — an optional identifier used to reference
        this resource in an external system
            
        - `description` — description of ResourceIssueOrder
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - `operation_ids` — IDs of Operations the order is for (`/operations`)
            
        - `items` — array of resources of the order, see below
            

        ### Required on create


        `document_date`, `operation_ids`, `items`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `approve` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/resource_issue_orders/ID/approve
            
        - `issue` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/resource_issue_orders/ID/issue
            
        - `cancel` — `POST`
        {{baseUrl}}/api/{{apiVersion}}/resource_issue_orders/ID/cancel
            

        ### Filters by


        `id`, `number`, `status`, `warehouse_id`, `document_date`,
        `operation_uuid`, `external_id`


        ### Order by


        `id`, `document_date`


        ### Important


        - Create takes `document_date`, `number` (optional), `description`
        (optional), `operation_ids` and `items` — an array of `resource_id`,
        `planned_quantity`, `warehouse_id`. Items are split by warehouse, so one
        request can create **several** orders: create answers `201 Created` with
        an array of all created orders and `meta.duplicates` — open orders that
        may already cover the same operations.
            
        - Update is possible only for an `approved` order and changes only
        issued quantities: `items_attributes` — array of `id`,
        `issued_quantity`.
            
        - The status cannot be changed through `update`; it moves only by the
        additional actions below. Status flow: `planned` → `approve` →
        `approved` → `issue` → `issued`; `cancel` works from `planned` and
        `approved`. Orders cannot be deleted.
            

        ### Additional actions


        #### `POST`
        {{baseUrl}}/api/{{apiVersion}}/resource_issue_orders/ID/approve


        Approves a `planned` order.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        #### `POST`
        {{baseUrl}}/api/{{apiVersion}}/resource_issue_orders/ID/issue


        Issues an `approved` order: writes the outgoing stock movements. `items`
        sets the issued quantity of each item; `issued_on` (date) is optional
        and defaults to now.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        #### `POST`
        {{baseUrl}}/api/{{apiVersion}}/resource_issue_orders/ID/cancel


        Cancels a `planned` or `approved` order. **Note:** `reason` is required
        and is sent at the top level of the body, not inside `data`.


        Response: `200 OK` with the updated record in the same format as
        **Single Resource**. An action that is not allowed from the current
        status returns `422` with `errors`.


        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/resource_issue_orders
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of resource issue order objects, where each object
        contains:
            
            - **id**: VelHerd ID of ResourceIssueOrder.
                
            - **number**: Number of the order.
                
            - **document_date**: Date of the document (date `YYYY-MM-DD`).
                
            - **warehouse_id**: ID of the warehouse the resources are issued from (`/farm_unit_items`).
                
            - **status**: Status of ResourceIssueOrder. Can be one of `planned`, `approved`, `issued`, `cancelled`.
                
            - **approved_by_id**: ID of the VelHerd user who approved the record.
                
            - **approved_at**: When the order was approved (date and time, ISO 8601).
                
            - **issued_by_id**: ID of the VelHerd user who issued the order.
                
            - **issued_at**: When the order was issued (date and time, ISO 8601).
                
            - **cancelled_by_id**: ID of the VelHerd user who cancelled it.
                
            - **cancelled_at**: When the order was cancelled (date and time, ISO 8601).
                
            - **cancel_reason**: Reason of the cancellation.
                
            - **operation_uuid**: UUID of the stock movements written on issue.
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **description**: Description of ResourceIssueOrder.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **operation_ids**: IDs of Operations the order is for (`/operations`).
                
            - **items**: Array of resources of the order, see below.
                
                - `id`
                    
                - `resource_id` — resource (`/resources`)
                    
                - `planned_quantity`
                    
                - `issued_quantity` — filled on issue
                    
                - `external_id`, `description`
                    

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "resource_issue_order",
                    "attributes": {
                        "id": 1,
                        "number": "RIO-0001",
                        "document_date": "2026-04-09",
                        "warehouse_id": 6,
                        "status": "approved",
                        "approved_by_id": 2,
                        "approved_at": "2026-04-09T12:00:00.000+03:00",
                        "issued_by_id": null,
                        "issued_at": null,
                        "cancelled_by_id": null,
                        "cancelled_at": null,
                        "cancel_reason": null,
                        "operation_uuid": null,
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00",
                        "operation_ids": [
                            17,
                            18
                        ],
                        "items": [
                            {
                                "id": 1,
                                "resource_id": 15,
                                "planned_quantity": "60.25",
                                "issued_quantity": null,
                                "external_id": null,
                                "description": null
                            }
                        ]
                    }
                },
                {
                    "id": "2",
                    "type": "resource_issue_order",
                    "attributes": {
                        "id": 2,
                        "number": "RIO-0002",
                        "document_date": "2026-04-09",
                        "warehouse_id": 6,
                        "status": "planned",
                        "approved_by_id": null,
                        "approved_at": null,
                        "issued_by_id": null,
                        "issued_at": null,
                        "cancelled_by_id": null,
                        "cancelled_at": null,
                        "cancel_reason": null,
                        "operation_uuid": null,
                        "external_id": "ERP-00042",
                        "description": null,
                        "created_at": "2026-03-05T16:40:03.118+02:00",
                        "updated_at": "2026-03-05T16:40:03.118+02:00",
                        "operation_ids": [
                            19
                        ],
                        "items": []
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 2,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the resource issue
        orders, enabling clients to easily access and utilize the information.
