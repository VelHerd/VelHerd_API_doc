  /api/v1/resource_prices:
    head:
      summary: introduction ResourcePrice
      tags:
        - API endpoints
        - Resource Prices
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: |-
        ## API Endpoint: Resource Prices

        ### Purpose

        This endpoint manages resource prices — the planning price of a resource for one season. Maps and plans keep norms only; this is where the money lives, one price per resource and season.

        ---

        ### ResourcePrice has next parameters

        - (readonly) `id` — VelHerd ID of ResourcePrice

        - `resource_id` — ID of Resource (`/resources`)

        - `season_id` — ID of Season (`/seasons`)

        - `unit_price` — price of one unit of the resource in its own unit

        - `currency` — currency, `uah` by default

        - `external_id` — an optional identifier used to reference this resource in an external system

        - `description` — description of ResourcePrice

        - (readonly) `created_at`

        - (readonly) `updated_at`


        ### Required on create

        `resource_id`, `season_id`, `unit_price`

        ### Acceptable methods

        - `Ids`

        - `Single Resource`

        - `Create Resource`

        - `Update Resource`

        - `Delete Resource`

        - `copy` — `POST` {{baseUrl}}/api/{{apiVersion}}/resource_prices/copy


        ### Filters by

        `id`, `resource_id`, `season_id`, `currency`, `external_id`

        ### Order by

        `id`, `unit_price`

        ### Important

        - One price per resource and season: a second one is refused with `422`.


        ### Additional actions

        #### `POST` {{baseUrl}}/api/{{apiVersion}}/resource_prices/copy

        Fills the empty cells of the price list of `season_id` from `source_season_id`, every price raised by `index_percent` percent (optional, `0` by default). Only resources without a price in the target season are copied: a price somebody already typed stays. Needs the right to create resource prices.

        Response: `200 OK` with `meta.created_count` — how many prices were created. A season named as its own source returns `422` with `errors`; an unknown season `404`.

        ---

        ### Request Format

        - **Method**: GET

        - **URL**: {{baseUrl}}/api/{{apiVersion}}/resource_prices


        ### Response Structure

        The response will contain a JSON object with the following structure:

        - **data**: An array of resource price objects, where each object contains:

            - **id**: VelHerd ID of ResourcePrice.

            - **resource_id**: ID of Resource (`/resources`).

            - **season_id**: ID of Season (`/seasons`).

            - **unit_price**: Price of one unit of the resource in its own unit.

            - **currency**: Currency. Can be one of `usd`, `eur`, `uah`, `gbp`.

            - **external_id**: An optional identifier used to reference this resource in an external system.

            - **description**: Description of ResourcePrice.

            - **created_at**: Created time

            - **updated_at**: Updated time


        - **meta**: Pagination info — `page`, `per_page`, `total_count`, `total_pages`. Pass `page[number]` and `page[size]` (default 100, max 500) to get other pages.


        ### Example Response

        ``` json
        {
            "data": [
                {
                    "id": "1",
                    "type": "resource_price",
                    "attributes": {
                        "id": 1,
                        "resource_id": 15,
                        "season_id": 2,
                        "unit_price": "1250.5",
                        "currency": "uah",
                        "external_id": null,
                        "description": null,
                        "created_at": "2026-03-02T09:14:27.512+02:00",
                        "updated_at": "2026-03-02T09:14:27.512+02:00"
                    }
                }
            ],
            "meta": {
                "page": 1,
                "per_page": 100,
                "total_count": 1,
                "total_pages": 1
            }
        }

         ```

        This response provides a structured overview of the resource prices, enabling clients to easily access and utilize the information.
