  /api/v1/bank_accounts:
    head:
      summary: introduction BankAccount
      tags:
        - API endpoints
        - Bank Accounts
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses: {}
      description: >-
        ## API Endpoint: Bank Accounts


        ### Purpose


        This endpoint manages bank accounts and cards of counterparties.


        ---


        ### BankAccount has next parameters


        - (readonly) `id` — VelHerd ID of BankAccount
            
        - (create only) `counterparty_id` — ID of Counterparty the account
        belongs to (`/counterparties`)
            
        - `bank_id` — ID of Bank (`/banks`)
            
        - `payment_type` — type of the account
            
        - `currency` — currency
            
        - `is_primary` — is it the primary account
            
        - `external_id` — an optional identifier used to reference this resource
        in an external system
            
        - (readonly) `created_at`
            
        - (readonly) `updated_at`
            
        - (readonly) `masked_number` — last four digits of the IBAN, account or
        card number, e.g. `**** 1234`
            
        - (write-only) `iban` — IBAN
            
        - (write-only) `account_number` — account number
            
        - (write-only) `card_number` — card number
            
        - (write-only) `description` — description of BankAccount
            

        ### Required on create


        `counterparty_id`, `currency`, `payment_type`


        ### Acceptable methods


        - `Ids`
            
        - `Single Resource`
            
        - `Create Resource`
            
        - `Update Resource`
            
        - `Delete Resource`
            

        ### Filters by


        `id`, `counterparty_id`, `bank_id`, `payment_type`, `currency`,
        `is_primary`, `external_id`


        ### Order by


        `id`, `is_primary`


        ### Important


        - `iban`, `account_number` and `card_number` are accepted but never
        returned in full and cannot be used in filters; the response carries
        only `masked_number`.
            
        - `counterparty_id` is set on create only and is ignored on update.
            

        ---


        ### Request Format


        - **Method**: GET
            
        - **URL**: {{baseUrl}}/api/{{apiVersion}}/bank_accounts
            

        ### Response Structure


        The response will contain a JSON object with the following structure:


        - **data**: An array of bank account objects, where each object
        contains:
            
            - **id**: VelHerd ID of BankAccount.
                
            - **counterparty_id**: ID of Counterparty the account belongs to (`/counterparties`).
                
            - **bank_id**: ID of Bank (`/banks`).
                
            - **payment_type**: Type of the account. Can be one of `account`, `card`.
                
            - **currency**: Currency. Can be one of `UAH`, `USD`, `EUR`.
                
            - **is_primary**: Is it the primary account (`true` or `false`).
                
            - **external_id**: An optional identifier used to reference this resource in an external system.
                
            - **created_at**: Created time
                
            - **updated_at**: Updated time
                
            - **masked_number**: Last four digits of the IBAN, account or card number, e.g. `**** 1234`.
                

        - **meta**: Pagination info — `page`, `per_page`, `total_count`,
        `total_pages`. Pass `page[number]` and `page[size]` (default 100, max
        500) to get other pages.
            

        ### Example Response


        ``` json

        {
            "data": [
                {
                    "id": "1",
                    "type": "bank_account",
                    "attributes": {
                        "id": 1,
                        "counterparty_id": 2,
                        "bank_id": 1,
                        "payment_type": "account",
                        "currency": "UAH",
                        "is_primary": true,
                        "external_id": null,
