      description: >-
        ## API Endpoint: Farm Unit Items


        ### Purpose


        This endpoint manages the items of farm units: places for animals,
        fields, machines and warehouses. Warehouses are the items with
        `item_type` = `warehouses`; they are used by stock movements, batches
        and issue orders.


